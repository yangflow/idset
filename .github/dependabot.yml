# The pr-title workflow skips Dependabot pull requests; the prefixes keep their titles Conventional Commits.
# The MyGo library and CLI are one module; after an upgrade, update THIRD_PARTY.md and resources/ThirdPartyLicenses/.
version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule: { interval: weekly }
    commit-message: { prefix: "build" }
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly }
    commit-message: { prefix: "ci" }
