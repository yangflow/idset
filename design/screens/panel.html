<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Panel</title>
<style>
:root { color-scheme:light; --background:#fafafa; --surface:#fff; --text:#242424; --muted:#666; --border:#d6d6d6; --accent:#006fdf; --accent-soft:#e6f0fc; --danger:#c62828; --danger-soft:#fdecec; --warning:#a15c00; --warning-soft:#fff4e0 }
:root[data-scheme=dark] { color-scheme:dark; --background:#202020; --surface:#2a2a2a; --text:#f3f3f3; --muted:#aaa; --border:#555; --accent:#4c9dff; --accent-soft:#1c2c40; --danger:#ff6b6b; --danger-soft:#3a2222; --warning:#f0b35a; --warning-soft:#3a3020 }
* { box-sizing:border-box }
body { margin:0; padding:24px; font-family:system-ui,sans-serif; font-size:13px; color:var(--text); background:#888 }
.panel { width:340px; height:480px; display:flex; flex-direction:column; background:var(--background); border:1px solid var(--border); border-radius:10px; overflow:hidden }
header, footer { display:flex; align-items:center; gap:8px; padding:12px 16px }
header { border-bottom:1px solid var(--border) }
footer { border-top:1px solid var(--border); justify-content:flex-end }
h1 { flex:1; margin:0; font-size:15px }
.content { flex:1; overflow:auto; padding:16px; display:flex; flex-direction:column; gap:12px }
button { padding:5px 10px; border:1px solid var(--border); border-radius:6px; background:var(--surface); color:var(--text); font:inherit }
button.icon { width:28px; padding:5px 0 }
.muted { color:var(--muted) }
.small { font-size:12px }
.mono { font-family:ui-monospace,monospace; font-size:12px }
.drop { border:1.5px dashed var(--border); border-radius:8px; padding:20px 16px; display:flex; flex-direction:column; align-items:center; gap:6px; text-align:center }
.drop.over { border-color:var(--accent); background:var(--accent-soft) }
.drop.compact { flex-direction:row; padding:8px 12px; justify-content:space-between; text-align:left }
.card { border:1px solid var(--border); border-radius:8px; padding:12px; background:var(--surface); display:flex; flex-direction:column; gap:4px }
.card.warning { background:var(--warning-soft); border-color:var(--warning) }
.card .title { display:flex; align-items:center; gap:8px; font-weight:600 }
.card .title span { flex:1 }
.path { cursor:pointer; text-decoration:underline dotted }
.dot { width:8px; height:8px; border-radius:50%; flex:none }
.row { display:flex; align-items:center; gap:10px; padding:8px 4px; border-radius:6px }
.row div { display:flex; flex-direction:column; min-width:0 }
.row .sub { color:var(--muted); font-size:12px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis }
.search { width:100%; padding:6px 8px; border:1px solid var(--border); border-radius:6px; background:var(--surface); color:var(--text); font:inherit }
.chips { display:flex; gap:6px }
.chip { padding:3px 8px; border-radius:12px; font-size:12px }
.chip.on { background:var(--accent); color:white; border-color:var(--accent) }
.center { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:8px; text-align:center }
.error { color:var(--danger) }
.spinner { width:20px; height:20px; border:2px solid var(--border); border-top-color:var(--accent); border-radius:50% }
</style>
<div class="panel">
  <header><h1>Idset</h1><button class="icon" data-t="close" aria-label="Hide">✕</button></header>
  <div class="content" id="content"></div>
  <footer><button data-t="quit">Quit</button></footer>
</div>
<script>
const q = new URLSearchParams(location.search);
document.documentElement.dataset.scheme = q.get('scheme') === 'dark' ? 'dark' : 'light';
const zh = q.get('lang') === 'zh';
const T = zh ? {
  close:'隐藏', quit:'退出', loading:'正在读取配置…', dropTitle:'把项目文件夹拖到这里', dropHint:'看看这个目录会用哪个身份推送',
  choose:'选择文件夹…', dropAgain:'拖入另一个文件夹，或', empty:'还没有身份', emptyHint:'添加身份的入口会在账户窗口里提供。',
  filter:'筛选身份', none:'没有匹配的身份', noAlias:'没有别名', readonly:'accounts.json 读不出来', readonlyHint:'在修好或从备份恢复之前，Idset 不会写入这个文件。',
  global:'范围：全局', scoped:'范围：', copy:'点击复制路径', copied:'已复制', noMatch:'没有身份匹配这个目录', notRepo:'不是 Git 仓库', clear:'清除结果',
} : {
  close:'Hide', quit:'Quit', loading:'Reading configuration…', dropTitle:'Drop a project folder here', dropHint:'See which identity pushes from it',
  choose:'Choose Folder…', dropAgain:'Drop another folder, or', empty:'No identities yet', emptyHint:'Identities are added in the accounts window.',
  filter:'Filter identities', none:'No matching identities', noAlias:'no alias', readonly:'accounts.json cannot be read', readonlyHint:'Idset will not write to it until it is fixed or restored from a backup.',
  global:'Scope: global', scoped:'Scope: ', copy:'Click to copy the path', copied:'Copied', noMatch:'No identity matches this folder', notRepo:'Not a Git repository', clear:'Clear result',
};
document.querySelectorAll('[data-t]').forEach(b => { b.textContent === '✕' ? b.setAttribute('aria-label', T[b.dataset.t]) : b.textContent = T[b.dataset.t] });
const ids = [
  ['work', 'github-work', 'bob@example.com', '#3A7BD5', 'github', '~/work/'],
  ['personal', 'github-personal', 'bob@example.net', '#2E9E5B', 'github', ''],
  ['client', 'gitlab-client', 'bob@client.example', '#E07A1F', 'gitlab', '~/work/client/'],
  ['', '', 'nobody@example.com', '#8E44AD', 'gitea', '~/misc/'],
];
const row = ([l, a, e, c]) => `<div class="row"><span class="dot" style="background:${c}"></span><div><span>${l || (zh ? '（未命名）' : '(unnamed)')}</span><span class="sub">${a || T.noAlias} · ${e}</span></div></div>`;
const drop = (compact, over) => compact
  ? `<div class="drop compact${over ? ' over' : ''}"><span class="muted small">${T.dropAgain}</span><button>${T.choose}</button></div>`
  : `<div class="drop${over ? ' over' : ''}"><strong>${T.dropTitle}</strong><span class="muted small">${T.dropHint}</span><button>${T.choose}</button></div>`;
const matched = `<div class="card"><div class="title"><span class="dot" style="background:#3A7BD5"></span><span>work</span><button class="icon" aria-label="${T.clear}">✕</button></div>
  <span class="muted small">github-work · bob@example.com</span><span class="small">${T.scoped}gitdir:~/work/</span>
  <span class="mono path" title="${T.copy}">~/work/api</span></div>`;
const unresolved = (msg) => `<div class="card warning"><div class="title"><span>${msg}</span><button class="icon" aria-label="${T.clear}">✕</button></div><span class="mono">~/scratch/notes</span></div>`;
const list = n => ids.slice(0, n).map(row).join('');
const filter = `<input class="search" placeholder="${T.filter}"><div class="chips"><button class="chip on">GitHub</button><button class="chip">GitLab</button><button class="chip">Gitea</button></div>`;
const states = {
  loading: `<div class="center"><div class="spinner"></div><span class="muted">${T.loading}</span></div>`,
  readonly: `<div class="card warning"><strong class="error">${T.readonly}</strong><span class="mono">~/.config/idset/accounts.json</span><span class="small">${T.readonlyHint}</span></div>`,
  empty: drop(false) + `<div class="center"><strong>${T.empty}</strong><span class="muted small">${T.emptyHint}</span></div>`,
  list: drop(false) + list(2),
  over: drop(false, true) + list(2),
  filter: drop(false) + filter + list(4),
  nofilter: drop(false) + filter + `<span class="muted center">${T.none}</span>`,
  matched: matched + drop(true) + list(2),
  nomatch: unresolved(T.noMatch) + drop(true) + list(2),
  notrepo: unresolved(T.notRepo) + drop(true) + list(2),
};
document.getElementById('content').innerHTML = states[q.get('state')] ?? states.list;
</script>
</html>
