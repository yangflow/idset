<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Panel</title>
<style>
:root { color-scheme:light; --background:#fafafa; --surface:#fff; --text:#242424; --muted:#666; --border:#d6d6d6; --accent:#006fdf; --accent-soft:#e6f0fc; --danger:#c62828; --warning:#c46a1a }
:root[data-scheme=dark] { color-scheme:dark; --background:#202020; --surface:#2a2a2a; --text:#f3f3f3; --muted:#aaa; --border:#555; --accent:#4c9dff; --accent-soft:#1c2c40; --danger:#ff6b6b; --warning:#f0a050 }
* { box-sizing:border-box }
body { margin:0; font-family:system-ui,sans-serif; font-size:13px; color:var(--text); background:#888; display:flex; gap:24px; padding:24px; align-items:flex-start }
.controls { width:220px; flex:none; display:flex; flex-direction:column; gap:14px; padding:14px; border-radius:10px; background:#f4f4f4; color:#242424; font-size:12px }
.controls h2 { margin:0 0 6px; font-size:11px; font-weight:600; text-transform:uppercase; letter-spacing:.04em; color:#666 }
.controls .group { display:flex; flex-wrap:wrap; gap:4px }
.controls button { padding:4px 8px; border:1px solid #ccc; border-radius:5px; background:#fff; color:#242424; font:inherit; cursor:pointer }
.controls button.on { background:#006fdf; border-color:#006fdf; color:#fff }
.controls .hint { color:#666; line-height:1.5 }
.controls kbd { padding:0 4px; border:1px solid #ccc; border-radius:3px; background:#fff; font-size:11px }
.panel { width:340px; height:480px; flex:none; display:flex; flex-direction:column; background:var(--background); border:1px solid var(--border); border-radius:10px; overflow:hidden }
header, footer { display:flex; align-items:center; gap:8px; padding:12px 16px }
header { border-bottom:1px solid var(--border) }
footer { border-top:1px solid var(--border); justify-content:flex-end }
h1 { flex:1; margin:0; font-size:15px }
.content { flex:1; overflow:auto; padding:16px; display:flex; flex-direction:column; gap:12px }
.panel button { padding:5px 10px; border:1px solid var(--border); border-radius:6px; background:var(--surface); color:var(--text); font:inherit }
.panel button.icon { width:28px; padding:5px 0 }
.muted { color:var(--muted) }
.small { font-size:12px }
.mono { font-family:ui-monospace,monospace; font-size:12px }
.drop { border:1.5px dashed var(--border); border-radius:8px; padding:20px 16px; display:flex; flex-direction:column; align-items:center; gap:6px; text-align:center }
.drop.over { border-color:var(--accent); background:var(--accent-soft) }
.drop.compact { flex-direction:row; padding:8px 12px; justify-content:space-between; text-align:left }
.card { border:1px solid var(--border); border-radius:8px; padding:12px; background:var(--surface); display:flex; flex-direction:column; gap:4px }
.card.warning { border-color:var(--warning) }
.card.danger { border-color:var(--danger) }
.card .title { display:flex; align-items:center; gap:8px; font-weight:600 }
.card .title span:not(.dot) { flex:1 }
.path { cursor:pointer; text-decoration:underline }
.dot { width:8px; height:8px; border-radius:50%; flex:none }
.row { display:flex; align-items:center; gap:10px; padding:8px 4px; border-radius:6px }
.row div { display:flex; flex-direction:column; min-width:0 }
.row .sub { color:var(--muted); font-size:12px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis }
.search { width:100%; padding:6px 8px; border:1px solid var(--border); border-radius:6px; background:var(--surface); color:var(--text); font:inherit }
.chips { display:flex; gap:6px }
.panel .chip { padding:3px 10px; border-radius:12px; font-size:12px }
.panel .chip.on { background:var(--accent); color:white; border-color:var(--accent) }
.center { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:8px; text-align:center }
.error { color:var(--danger) }
.spinner { width:16px; height:16px; flex:none; border:2px solid var(--border); border-top-color:var(--accent); border-radius:50% }
.center .spinner { width:20px; height:20px }
.checking { display:flex; align-items:center; gap:8px }
</style>
<aside class="controls">
  <div><h2>State</h2><div class="group" id="states"></div></div>
  <div><h2>Scheme</h2><div class="group" id="schemes"></div></div>
  <div><h2>Language</h2><div class="group" id="langs"></div></div>
  <div class="hint">URL: <code>?state=…&amp;scheme=dark&amp;lang=zh</code><br><kbd>←</kbd> <kbd>→</kbd> switch state.</div>
</aside>
<div class="panel">
  <header><h1>Idset</h1><button class="icon" id="hide">✕</button></header>
  <div class="content" id="content"></div>
  <footer><button id="quit"></button></footer>
</div>
<script>
const TEXT = {
  zh: {
    close:'隐藏', quit:'退出', loading:'正在读取配置…', dropTitle:'把项目文件夹拖到这里', dropHint:'看看这个目录会用哪个身份推送',
    choose:'选择文件夹…', dropAgain:'拖入另一个文件夹，或', empty:'还没有身份', emptyHint:'添加身份的入口会在账户窗口里提供。',
    filter:'筛选身份', none:'没有匹配的身份', noAlias:'没有别名', unnamed:'（未命名）', readonly:'accounts.json 读不出来',
    readonlyHint:'在修好或从备份恢复之前，Idset 不会写入这个文件。', scope:'范围：gitdir ', copy:'复制完整路径',
    noMatch:'没有身份匹配这个目录', notRepo:'不是 Git 仓库', notFolder:'只能查看文件夹', checking:'正在查看 ~/work/api…',
    gitFailed:'无法运行 git：exec: "git": executable file not found in $PATH', clear:'清除结果', custom:'自定义',
  },
  en: {
    close:'Hide', quit:'Quit', loading:'Reading configuration…', dropTitle:'Drop a project folder here', dropHint:'See which identity pushes from it',
    choose:'Choose Folder…', dropAgain:'Drop another folder, or', empty:'No identities yet', emptyHint:'Identities are added in the accounts window.',
    filter:'Filter identities', none:'No matching identities', noAlias:'no alias', unnamed:'(unnamed)', readonly:'accounts.json cannot be read',
    readonlyHint:'Idset will not write to it until it is fixed or restored from a backup.', scope:'Scope: gitdir ', copy:'Copy the full path',
    noMatch:'No identity matches this folder', notRepo:'Not a Git repository', notFolder:'Only folders can be checked', checking:'Checking ~/work/api…',
    gitFailed:'Could not run git: exec: "git": executable file not found in $PATH', clear:'Clear result', custom:'Custom',
  },
};
const STATES = {
  list:'有身份', over:'拖着经过', filter:'筛选', nofilter:'筛选无结果', checking:'正在查看', matched:'已匹配',
  nomatch:'没有匹配', notrepo:'不是仓库', notfolder:'不是文件夹', giterror:'git 失败', empty:'没有身份', loading:'读取中', readonly:'读不出来',
};
const ids = [
  ['work', 'github-work', 'bob@example.com', '#3A7BD5'],
  ['personal', 'github-personal', 'bob@example.net', '#2E9E5B'],
  ['client', 'gitlab-client', 'bob@client.example', '#E07A1F'],
  ['', '', 'nobody@example.com', '#8E44AD'],
];
const q = new URLSearchParams(location.search);
const view = {
  state: STATES[q.get('state')] ? q.get('state') : 'list',
  scheme: q.get('scheme') === 'dark' ? 'dark' : 'light',
  lang: q.get('lang') === 'zh' ? 'zh' : 'en',
};

function panel(state, T) {
  const row = ([l, a, e, c]) => `<div class="row"><span class="dot" style="background:${c}"></span><div><span>${l || T.unnamed}</span><span class="sub">${a || T.noAlias} · ${e}</span></div></div>`;
  const list = n => ids.slice(0, n).map(row).join('');
  const clear = `<button class="icon" aria-label="${T.clear}">✕</button>`;
  const drop = (compact, over) => compact
    ? `<div class="drop compact"><span class="muted small">${T.dropAgain}</span><button>${T.choose}</button></div>`
    : `<div class="drop${over ? ' over' : ''}"><strong>${T.dropTitle}</strong><span class="muted small">${T.dropHint}</span><button>${T.choose}</button></div>`;
  const filter = `<input class="search" placeholder="${T.filter}"><div class="chips"><button class="chip on">GitHub</button><button class="chip">GitLab</button><button class="chip">Gitea</button></div>`;
  const unresolved = (msg, path) => `<div class="card warning"><div class="title"><span>${msg}</span>${clear}</div><span class="mono">${path}</span></div>`;
  const matched = `<div class="card"><div class="title"><span class="dot" style="background:#3A7BD5"></span><span>work</span>${clear}</div>
    <span class="muted small">github-work · bob@example.com</span><span class="small">${T.scope}~/work/</span>
    <span class="mono path" title="${T.copy}">~/work/api</span></div>`;
  return {
    loading: `<div class="center"><div class="spinner"></div><span class="muted">${T.loading}</span></div>`,
    readonly: `<div class="card danger"><strong class="error">${T.readonly}</strong><span class="mono">~/.config/idset/accounts.json</span><span class="small">${T.readonlyHint}</span></div>`,
    empty: drop(false) + `<div class="center"><strong>${T.empty}</strong><span class="muted small">${T.emptyHint}</span></div>`,
    list: drop(false) + list(2),
    over: drop(false, true) + list(2),
    filter: drop(false) + filter + list(4),
    nofilter: drop(false) + filter + `<span class="muted center">${T.none}</span>`,
    checking: `<div class="card"><div class="checking"><div class="spinner"></div><span class="small">${T.checking}</span></div></div>` + drop(true) + list(2),
    matched: matched + drop(true) + list(2),
    nomatch: unresolved(T.noMatch, '~/scratch/notes') + drop(true) + list(2),
    notrepo: unresolved(T.notRepo, '~/scratch/notes') + drop(true) + list(2),
    notfolder: unresolved(T.notFolder, '~/Downloads/report.pdf') + drop(true) + list(2),
    giterror: `<div class="card danger"><div class="title"><span>${T.gitFailed}</span>${clear}</div></div>` + drop(true) + list(2),
  }[state];
}

function buttons(id, options, key) {
  document.getElementById(id).innerHTML = Object.entries(options)
    .map(([value, label]) => `<button data-value="${value}" class="${view[key] === value ? 'on' : ''}">${label}</button>`).join('');
  document.getElementById(id).onclick = e => { const v = e.target.dataset.value; if (v) { view[key] = v; render(); } };
}

function render() {
  const T = TEXT[view.lang];
  document.documentElement.dataset.scheme = view.scheme;
  document.getElementById('hide').setAttribute('aria-label', T.close);
  document.getElementById('quit').textContent = T.quit;
  document.getElementById('content').innerHTML = panel(view.state, T);
  buttons('states', STATES, 'state');
  buttons('schemes', { light:'浅色', dark:'深色' }, 'scheme');
  buttons('langs', { zh:'中文', en:'English' }, 'lang');
  history.replaceState(null, '', `?state=${view.state}&scheme=${view.scheme}&lang=${view.lang}`);
}

onkeydown = e => {
  if (e.key !== 'ArrowLeft' && e.key !== 'ArrowRight') return;
  const keys = Object.keys(STATES), i = keys.indexOf(view.state);
  view.state = keys[(i + (e.key === 'ArrowRight' ? 1 : keys.length - 1)) % keys.length];
  render();
};
render();
</script>
</html>
