<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Panel</title>
<style>
/* Glass and Git orange; see design/tokens.md. The panel draws no background of its own: the window's Popover material
   (simulated here by .panel over the desktop) shows through, and cards sit on it as translucent fills. */
:root { color-scheme:light; --material:rgba(246,246,248,.62); --text:#1d1d1f; --muted:#6b6b72; --sep:rgba(60,60,67,.18); --card:rgba(255,255,255,.2); --control:rgba(0,0,0,.05); --hover:rgba(0,0,0,.07); --pressed:rgba(0,0,0,.12); --field:rgba(255,255,255,.45); --accent:#c63a1c; --accent-hover:#ad3218; --accent-text:#ffffff; --accent-soft:rgba(240,80,51,.16); --danger:#c8102e; --warning:#b86e00; --success:#1e7d36; --focus:rgba(198,58,28,.55); --inverse:#1d1d1f; --inverse-text:#f5f5f7; --menu:rgba(255,255,255,.54); --glass:blur(10px) saturate(110%); --rim:rgba(255,255,255,.7) }
:root[data-scheme=dark] { color-scheme:dark; --material:rgba(36,36,40,.58); --text:#f5f5f7; --muted:#a3a3ab; --sep:rgba(255,255,255,.12); --card:rgba(255,255,255,.08); --control:rgba(255,255,255,.08); --hover:rgba(255,255,255,.11); --pressed:rgba(255,255,255,.16); --field:rgba(0,0,0,.22); --accent:#ff6a4a; --accent-hover:#ff8468; --accent-text:#1d1d1f; --accent-soft:rgba(255,106,74,.22); --danger:#ff5c74; --warning:#ffb340; --success:#3ccf62; --focus:rgba(255,132,104,.6); --inverse:#f5f5f7; --inverse-text:#1d1d1f; --menu:rgba(60,60,60,.64); --glass:blur(10px) saturate(220%); --rim:rgba(255,255,255,.18) }
* { box-sizing:border-box }
body { margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI Variable Text","Segoe UI","PingFang SC","Microsoft YaHei UI",system-ui,sans-serif; font-size:13px; -webkit-font-smoothing:antialiased; color:var(--text); display:flex; gap:24px; padding:24px; align-items:flex-start; min-height:100vh;
  background:radial-gradient(60% 50% at 15% 20%,#9fd8ff,transparent 70%),radial-gradient(50% 60% at 85% 30%,#b8f0c9,transparent 70%),radial-gradient(60% 60% at 50% 100%,#ffd8a8,transparent 70%),linear-gradient(135deg,#7cc4f5,#a7e3d0 60%,#f6e3b5) }
:root[data-scheme=dark] body { background:radial-gradient(60% 50% at 15% 20%,#2b4f8f,transparent 70%),radial-gradient(50% 60% at 85% 30%,#1f5e4a,transparent 70%),radial-gradient(60% 60% at 50% 100%,#6b3a2a,transparent 70%),linear-gradient(135deg,#14213d,#0f2a2a 60%,#2a1a14) }
/* Stripes on the desktop, so the blur behind the panel shows. */
body::before { content:""; position:fixed; inset:0; z-index:-1; background:repeating-linear-gradient(45deg,rgba(255,255,255,.1) 0 14px,transparent 14px 40px) }
.controls { width:220px; flex:none; display:flex; flex-direction:column; gap:14px; padding:14px; border-radius:10px; background:#f4f4f4; color:#242424; font-size:12px }
.controls h2 { margin:0 0 6px; font-size:11px; font-weight:600; text-transform:uppercase; letter-spacing:.04em; color:#666 }
.controls .group { display:flex; flex-wrap:wrap; gap:4px }
.controls button { padding:4px 8px; border:1px solid #ccc; border-radius:5px; background:#fff; color:#242424; font:inherit; cursor:pointer }
.controls button.on { background:#006fdf; border-color:#006fdf; color:#fff }
.controls .hint { color:#666; line-height:1.5 }
.controls kbd { padding:0 4px; border:1px solid #ccc; border-radius:3px; background:#fff; font-size:11px }
/* The window: 340 x 480, 12 corners, the material and the system's shadow. "Reduce transparency" makes it opaque. */
.panel { isolation:isolate; position:relative; width:340px; height:480px; flex:none; display:flex; flex-direction:column; border-radius:12px; overflow:hidden; background:var(--material); box-shadow:0 0 0 .5px rgba(0,0,0,.25),0 12px 40px rgba(0,0,0,.3) }
/* The material is drawn under the window rather than on it, so that the glass of a menu or dialog inside can blur the window's content. */
.panel::before { content:""; position:absolute; inset:0; z-index:-1; border-radius:inherit; backdrop-filter:blur(30px) saturate(180%); -webkit-backdrop-filter:blur(30px) saturate(180%) }
.solid .panel { background:#f2f2f5 }
.solid .panel::before { display:none }
:root[data-scheme=dark] .solid .panel { background:#2a2a2e }
/* Chrome: the title row is 44 high with no hairline, the footer 40 with a hairline; icon buttons 26 x 26 with 16 glyphs, 4 apart. */
header, footer { display:flex; align-items:center; flex:none }
header { height:44px; gap:8px; padding:0 9px 0 16px }
footer { height:40px; gap:4px; padding:0 8px; border-top:.5px solid var(--sep) }
footer .spacer { flex:1 }
h1 { flex:1; margin:0; font-size:15px; letter-spacing:-.01em; font-weight:600 }
.panel button.tool { flex:none; position:relative; width:26px; height:26px; padding:0; display:grid; place-items:center; border:0; border-radius:6px; background:transparent; color:var(--muted); cursor:pointer }
.panel button.tool:hover { background:var(--hover) }
.panel button.tool:active { background:var(--pressed) }
.panel button.tool.pinned { background:var(--hover) }
.tool svg { width:16px; height:16px }
/* Tooltip: Inverse fill, no shadow; shows on hover, or pinned with ?tip=<name>. */
.panel [data-tip] { position:relative }
[data-tip]::after { content:attr(data-tip); position:absolute; z-index:5; display:none; padding:4px 8px; border-radius:6px; background:var(--inverse); color:var(--inverse-text); font-size:12px; font-weight:400; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI Variable Text","Segoe UI","PingFang SC","Microsoft YaHei UI",system-ui,sans-serif; line-height:16px; white-space:normal; width:max-content; max-width:240px; text-align:left; pointer-events:none; bottom:calc(100% + 6px); left:50% ; transform:translateX(-50%) }
[data-tip].tip-start::after { left:0; transform:none }
[data-tip].tip-end::after { left:auto; right:0; transform:none }
[data-tip].tip-below::after { bottom:auto; top:calc(100% + 6px) }
[data-tip]:hover::after, [data-tip].pinned::after { display:block }
/* Content: 12 at the sides, cards 10 apart; a group heading sits 12 above its card. */
.content { flex:1; overflow:auto; padding:4px 12px 12px; display:flex; flex-direction:column; gap:10px }
.content > * { flex-shrink:0 }
.panel button { padding:5px 10px; border:0; border-radius:6px; background:var(--control); color:var(--text); font:inherit }
.panel button.icon { width:28px; padding:5px 0 }
.panel button.text { background:transparent; padding:5px 4px; color:var(--accent); font-weight:500; display:inline-flex; align-items:center; gap:4px; align-self:flex-start }
.panel button.text svg { width:14px; height:14px }
.muted { color:var(--muted) }
.small { font-size:12px }
.mono { font-family:"SF Mono",ui-monospace,Menlo,Consolas,monospace; font-size:11.5px }
/* Drop zone: the accent's dashed outline at 55% over an 8% tint, a folder glyph, the line and a small primary button. */
.drop { display:flex; align-items:center; gap:10px; height:48px; padding:0 10px 0 12px; border:1.5px dashed color-mix(in srgb, var(--accent) 55%, transparent); border-radius:10px; background:color-mix(in srgb, var(--accent) 8%, transparent) }
.drop > svg { flex:none; width:20px; height:20px; color:var(--accent) }
.drop .line { flex:1; min-width:0; font-size:12px; color:var(--text); white-space:nowrap; overflow:hidden; text-overflow:ellipsis }
.drop.over { border-style:solid; border-color:var(--accent); background:var(--accent-soft) }
.panel .drop button { flex:none; height:24px; padding:0 10px; font-size:12px; font-weight:500 }
/* Initial badge: the identity's color, solid, the letter in white or near black, whichever reads better on it. */
.avatar { flex:none; display:grid; place-items:center; font-weight:600; color:var(--ink); background:rgb(var(--c)) }

/* Result card: a context line with the folder and its actions, then the answer. Cards are fills, not outlines;
   a card that needs attention adds a 1 DIP inner outline in Warning or Danger. */
.result { border-radius:10px; background:var(--card) }
.result.warning { box-shadow:inset 0 0 0 1px var(--warning) }
.result.danger { box-shadow:inset 0 0 0 1px var(--danger) }
.result .top { display:flex; align-items:center; gap:4px; height:36px; padding:0 6px 0 12px; border-bottom:.5px solid var(--sep) }
.result .top .cluster { flex:0 1 auto; min-width:0; display:flex; align-items:center; gap:2px }
.result .top .mid { flex:1 0 80px; color:var(--muted) }
.result .copied { flex:0 1 auto; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-size:11px; color:var(--muted); margin-right:2px }
.result .who { display:flex; align-items:center; gap:10px; padding:12px 12px 8px }
.result .avatar { width:36px; height:36px; border-radius:10px; font-size:16px }
.result .name { font-size:15px; font-weight:600 }
.result .uses { font-size:12px; color:var(--muted) }
.result .kv { display:grid; grid-template-columns:56px 1fr; align-items:start; gap:4px 8px; padding:0 12px 12px 58px; font-size:12px }
.result .kv > :nth-child(odd) { color:var(--muted) }
.result .finds { border-top:.5px solid var(--sep); padding:4px 0 }
.result .find { display:flex; align-items:center; gap:6px; height:28px; padding:0 12px; font-size:12px }
.result .find > svg { flex:none; width:14px; height:14px }
.result .find.warning > svg { color:var(--warning) }
.result .find.danger > svg { color:var(--danger) }
.find .says { flex:1 1 auto; min-width:0; display:flex; white-space:pre }
.find .says > span { flex:none }
.find .says > .give { flex:0 1 auto; min-width:0; overflow:hidden; text-overflow:ellipsis }
.find .says > .mid { flex:0 1 auto }
.result .find.remote { padding-right:6px }
.find.remote .says { align-items:center; gap:6px }
.find.remote .says > svg { flex:none; width:14px; height:14px; color:var(--muted) }
.ack { flex:none; font-size:11px; color:var(--muted); white-space:nowrap }
.panel button.tool:disabled { opacity:.4; cursor:default; background:transparent }
.clone { display:flex; flex-direction:column; gap:4px; padding:8px 12px 10px }
.result .clone { border-top:.5px solid var(--sep) }
.clone .line { display:flex; align-items:center; gap:4px }
.clone .inputwrap { flex:1; min-width:0; display:flex }
.panel input.field { width:100%; height:28px; padding:0 8px; border:.5px solid var(--sep); border-radius:6px; background:var(--field); color:var(--text); font-family:"SF Mono",ui-monospace,Menlo,Consolas,monospace; font-size:11.5px }
.panel input.field::placeholder { color:var(--muted) }
.panel input.field.focus { outline:3px solid var(--focus); outline-offset:0; border-color:var(--accent) }
.clone .out { display:flex; align-items:center; height:16px; padding:0 2px; font-size:11px; color:var(--muted) }
.clone .out .mid { flex:1 1 0; font-size:11px }
.clone .out .hint { white-space:nowrap; overflow:hidden; text-overflow:ellipsis }
/* Expanded identity row: the helper sits inside the list under its row, lined up with the name (12 + 28 badge + 10 = 50). */
.list .clone { padding:0 12px 10px 50px }
.item .chev { transform:rotate(-90deg) }
.item.open .chev { transform:none }
.item .gap { flex:none; width:26px }
.result .say { padding:12px; display:flex; align-items:center; gap:8px; font-weight:600 }
.result .say.plain { font-weight:400 }
.result .say.danger { color:var(--danger); font-weight:600 }

/* Binding. Rows are 44 high, buttons 28 high and 80 wide, so a label never resizes a control. */
.panel button.field { background:var(--control) }
.panel button.fixed { width:80px; height:28px; padding:0; text-align:center }
.panel button.primary { background:var(--accent); color:var(--accent-text); font-weight:500 }
.result .head { padding:0 12px 6px; font-size:11px; font-weight:600; color:var(--muted) }
.result .say.tight { padding-bottom:8px }
.result .say .tool { margin-left:auto }
.result .why { padding:0 12px 12px; font-family:"SF Mono",ui-monospace,Menlo,Consolas,monospace; font-size:11px; color:var(--muted) }
.why span, .reason span { display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; overflow-wrap:anywhere }
.result .row { position:relative; display:flex; align-items:center; gap:10px; height:44px; padding:0 12px }
.result .row::before { content:""; position:absolute; top:0; left:12px; right:0; border-top:.5px solid var(--sep) }
.result .row.short { height:40px; padding:0 8px }
.result .row .dot { flex:none; width:10px; height:10px; border-radius:50%; background:rgb(var(--c)) }
:root[data-scheme=dark] .result .row .dot { background:rgb(var(--cl)) }
.result .row .lines { flex:1; min-width:0; display:flex; flex-direction:column; gap:1px }
.result .row .label { font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap }
.result .row .note { display:flex; font-size:12px; color:var(--muted) }
.result .row .note > span { white-space:pre }
.result .row .go { flex:none; width:44px; text-align:right; color:var(--accent); font-weight:500 }
.result .row.lost .label { color:var(--muted); font-weight:400 }
.result .row .verdict { flex:none; display:flex; align-items:center; gap:4px; font-size:12px; color:var(--muted) }
.result .row .verdict.win { color:var(--accent); font-weight:600 }
.result .row .verdict svg { width:14px; height:14px }
.result .confirm { border-top:.5px solid var(--sep); padding:12px; display:flex; flex-direction:column; gap:10px }
.result .confirm p { margin:0; line-height:1.45 }
.result .buttons { display:flex; justify-content:flex-end; gap:8px }
.result button.text { align-self:center }
.result .kv .paths { display:flex; flex-direction:column; gap:2px }
.result .actions { display:flex; align-items:center; justify-content:flex-end; gap:4px; height:36px; padding:0 8px; border-top:.5px solid var(--sep) }
.result .menuwrap { position:relative; display:flex }
.panel button.text.quiet { color:var(--muted) }
/* The menu: the system's Menu material, 8 corners and a shadow; it opens 4 below the context line. */
.menu { position:absolute; z-index:4; top:calc(100% + 9px); right:0; width:224px; padding:5px; border-radius:10px; background:var(--menu); backdrop-filter:var(--glass); -webkit-backdrop-filter:var(--glass); box-shadow:inset 0 0 0 .5px var(--rim),0 0 0 .5px rgba(0,0,0,.2),0 10px 30px rgba(0,0,0,.25) }
.menu .mhead { height:24px; padding:0 8px; display:flex; align-items:center; font-size:11px; font-weight:600; color:var(--muted) }
.menu .msep { height:.5px; margin:4px 8px; background:var(--sep) }
.menu .entry { display:flex; align-items:center; gap:8px; height:26px; padding:0 8px; border-radius:6px }
.menu .entry.hot { background:var(--accent); color:var(--accent-text) }
.menu .entry.hot .tag { color:inherit; opacity:.8 }
.menu .entry .dot { flex:none; width:10px; height:10px; border-radius:50%; background:rgb(var(--c)) }
:root[data-scheme=dark] .menu .entry .dot { background:rgb(var(--cl)) }
.menu .entry .label { flex:1 }
.menu .entry .tag { font-family:"SF Mono",ui-monospace,Menlo,Consolas,monospace; font-size:11px; color:var(--muted) }
.result .bar { position:relative; display:flex; align-items:center; gap:0; min-height:36px; padding:8px 12px; border-top:.5px solid var(--sep); line-height:1.4 }
.result .bar.timed { height:36px; padding:0 8px 0 12px; border-radius:0 0 10px 10px; overflow:hidden }
/* The countdown: a 2 DIP line on the bottom edge of the bar, as wide as the time left of the card's width (here 3 of 5 seconds), Accent at 45%. */
.result .bar.timed::after { content:""; position:absolute; left:0; bottom:0; height:2px; width:var(--left); background:color-mix(in srgb, var(--accent) 45%, transparent) }
.result .bar button.text { padding:5px 4px }
.result .stale-head { display:flex; align-items:center; gap:10px; height:40px; padding:0 12px }
.result .stale-head .dot { flex:none; width:10px; height:10px; border-radius:50%; background:rgb(var(--c)) }
:root[data-scheme=dark] .result .stale-head .dot { background:rgb(var(--cl)) }
.result .stale-head .rest { flex:1 1 auto; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap }
.result .stale-head .name { font-weight:600 }
.result .path-row.old { border-top:.5px solid var(--sep) }
.result .path-row { display:flex; align-items:center; gap:6px; height:28px; padding:0 12px; }
.result .path-row.old .mid { color:var(--muted) }
.path-row > svg { flex:none; width:14px; height:14px; color:var(--muted) }
/* Middle truncation: the start of a path ("~/", "/" or a drive) and its last folder (and any suffix) never shrink; what lies between takes the ellipsis. */
.mid { position:relative; display:flex; min-width:0; white-space:pre; font-family:"SF Mono",ui-monospace,Menlo,Consolas,monospace; font-size:11.5px }
.mid .ml { flex:none }
.mid .mh { min-width:0; overflow:hidden; text-overflow:ellipsis }
.mid .mt { flex:none }
.result .path-row .mid { flex:1 1 0 }
.panel.full { height:auto; min-height:480px }
.panel .content { min-height:0 }

/* Identity list: a group heading with the count, then one card; rows carry the initial badge, hairlines start at the name. */
.section { padding:6px 6px 0; margin-bottom:-4px; font-size:11px; font-weight:600; color:var(--muted); letter-spacing:.02em }
.list { border-radius:10px; background:var(--card); overflow:hidden }
.item { position:relative; display:flex; align-items:center; gap:10px; padding:8px 6px 8px 12px; min-height:48px }
.list > .item:not(:first-child)::before { content:""; position:absolute; top:0; left:50px; right:0; border-top:.5px solid var(--sep) }
.item .avatar { width:28px; height:28px; border-radius:8px; font-size:13px }
.item .text { flex:1; min-width:0; display:flex; flex-direction:column; gap:1px }
.item .label { font-weight:600; font-size:13px }
.item .label, .item .email { overflow:hidden; text-overflow:ellipsis; white-space:nowrap }
.item .email { font-size:12px; color:var(--muted) }
.item .tag { flex:none; max-width:42%; display:flex; font-family:"SF Mono",ui-monospace,Menlo,Consolas,monospace; font-size:11px; color:var(--muted) }
.item .tag .mid { font-size:inherit; min-width:0 }
.result .row .note .mid { font-family:"SF Mono",ui-monospace,Menlo,Consolas,monospace; font-size:11px }

.search { width:100%; height:28px; padding:0 10px; border:0; border-radius:8px; background:var(--control); color:var(--text); font:inherit }
.search::placeholder { color:var(--muted) }
.chips { display:flex; gap:6px }
.panel .chip { height:24px; padding:0 10px; border-radius:12px; font-size:12px }
.panel .chip.on { background:var(--accent); color:var(--accent-text); font-weight:500 }
.center { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:8px; text-align:center }
.error { color:var(--danger) }
.spinner { width:16px; height:16px; flex:none; border:2px solid var(--sep); border-top-color:var(--accent); border-radius:50% }
.center .spinner { width:20px; height:20px }
/* accounts.json cannot be read: nothing else can be done, so the error takes the whole panel. */
.readonly { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:8px; text-align:center; padding:0 8px }
.readonly .warn { width:48px; height:48px; border-radius:12px; display:grid; place-items:center; color:var(--danger); background:color-mix(in srgb, var(--danger) 14%, transparent) }
.readonly .warn svg { width:24px; height:24px }
.readonly .title { font-size:15px; font-weight:600 }
.readonly .path { font-family:"SF Mono",ui-monospace,Menlo,Consolas,monospace; font-size:11.5px; color:var(--muted) }
.readonly .reason { width:100%; font-family:"SF Mono",ui-monospace,Menlo,Consolas,monospace; font-size:11px; color:var(--muted); overflow-wrap:anywhere }
.readonly .hint { font-size:12px; color:var(--muted) }
.readonly .actions { display:flex; flex-wrap:wrap; justify-content:center; gap:8px; margin-top:8px }
.panel button.fixed.wide { width:120px }
.panel button.fixed.full { width:248px }
.panel button.pad { height:28px; padding:0 16px; margin-top:4px }
/* Empty: the product icon's key in a tinted tile, the title, the hint, Add and Import. */
.hero { width:56px; height:56px; border-radius:14px; display:grid; place-items:center; background:var(--accent-soft); color:var(--accent); margin-bottom:4px }
.hero svg { width:34px; height:24px }
.center .big { font-size:15px }
/* Diagnostics. The connectivity dot: 7 across in a 14 DIP slot: Success, Danger, or a Muted ring until the first round ends. */
.item .conn { flex:none; width:14px; height:14px; display:grid; place-items:center }
.item .conn::before { content:""; width:7px; height:7px; border-radius:50%; box-sizing:border-box }
.item .conn.ok::before { background:var(--success) }
.item .conn.fail::before { background:var(--danger) }
.item .conn.pending::before { border:1.5px solid var(--muted) }
/* Problem bar: under its row inside the list, lined up with the name (50) like the clone helper. */
.list .problem { display:flex; flex-direction:column; padding:0 6px 8px 50px; margin-top:-6px }
.problem .pline { display:flex; align-items:center; gap:6px; height:28px; font-size:12px }
.problem .pline > svg { flex:none; width:14px; height:14px }
.problem.danger .pline > svg { color:var(--danger) }
.problem.quiet .pline > svg { color:var(--muted) }
.problem .says { flex:1 1 auto; min-width:0; display:flex; white-space:pre }
.problem .says > span { flex:none }
.problem .says > .mid { flex:0 1 auto; font-size:11px }
.problem .pact { display:flex; align-items:center; gap:12px; height:24px; padding-left:20px }
.problem .pact button.text { padding:2px 0; font-size:12px }
.problem .pact button.tool:first-child { margin-left:-4px }
.problem .hint { padding:0 4px 4px 20px; font-size:12px; color:var(--muted); line-height:1.4 }
.problem .cmd { display:flex; align-items:center; gap:4px; height:28px; padding-left:20px }
.problem .cmd .mid { flex:1 1 0; font-size:11px; color:var(--muted) }
.result.notice { padding:0 6px 6px 12px }
.result.notice .pline { font-size:13px; font-weight:600 }
.result.notice .hint { padding-left:20px }
/* Diagnostics summary: the last block of the content. Healthy: one muted line. Otherwise a card whose 32 DIP heading opens one entry per problem. */
.okline { display:flex; align-items:center; gap:6px; padding:0 6px; font-size:12px; color:var(--muted) }
.okline svg { width:14px; height:14px; color:var(--success) }
.summary { border-radius:10px; background:var(--card); overflow:hidden }
.summary .shead { display:flex; align-items:center; gap:6px; height:32px; padding:0 8px 0 12px; font-size:12px; font-weight:600 }
.summary .shead > svg { flex:none; width:14px; height:14px }
.summary .shead .count { flex:1 }
.summary .shead .chev { transform:rotate(-90deg); color:var(--muted) }
.summary.open .shead .chev { transform:none }
.summary .entry { display:flex; align-items:flex-start; gap:6px; padding:8px 12px; border-top:.5px solid var(--sep); font-size:12px }
.summary .entry > svg { flex:none; width:14px; height:14px; margin-top:1px }
.summary .entry .lines { flex:1; min-width:0; display:flex; flex-direction:column; gap:2px; line-height:1.4 }
.summary .entry .how { color:var(--muted) }
.summary .entry .code { flex:none; font-family:"SF Mono",ui-monospace,Menlo,Consolas,monospace; font-size:11px; color:var(--muted); margin-top:1px }
.summary .entry button.text { padding:2px 0; font-size:12px }
.summary .warning > svg, .problem.warning .pline > svg { color:var(--warning) }
.summary .danger > svg { color:var(--danger) }
/* The tray icon beside the panel in the diagnostics states: not part of the panel, drawn like the controls. */
.trayfig { width:300px; flex:none; display:flex; flex-direction:column; gap:10px; padding:14px; border-radius:10px; background:#f4f4f4; color:#242424; font-size:12px }
.trayfig h2 { margin:0; font-size:11px; font-weight:600; text-transform:uppercase; letter-spacing:.04em; color:#666 }
.trayfig .trow { display:grid; grid-template-columns:repeat(3, 1fr); gap:6px }
.trayfig .strip { display:grid; place-items:center; height:44px; border-radius:6px }
.trayfig .strip svg { height:24px }
.trayfig .strip svg.square { width:32px; height:32px }
.trayfig .strip.now { outline:2px solid #006fdf; outline-offset:1px }
.trayfig .names { display:grid; grid-template-columns:repeat(3, 1fr); gap:6px; text-align:center; color:#666 }
.trayfig .hint { color:#666; line-height:1.5 }

    'diag-hostkey': drop() + list(withGlobal, false, null, failed(client, bar.hostkey(client), T.hostkey(client.host))) + diag([net(client)]),
    'diag-https': matched({ https:true, clone:{ value:'org/repo' } }) + drop() + list(withGlobal, false, null, { conn:{}, bars:{ work:bar.https(work) } }) + diag([]),
    'diag-nossh': noSSH + drop() + list(withGlobal, false, null, { conn:{ work:'fail', personal:'fail', client:'fail' }, why:T.noSSH }) + worstMark('danger'),
    'diag-summary': matched({ finds:[check.noemail] }) + drop() + list(withGlobal, false, null, failed(work, bar.denied(work), T.denied(work.provider))) + diag(issues, true),
    'diag-summary-closed': matched({ finds:[check.noemail] }) + drop() + list(withGlobal, false, null, failed(work, bar.denied(work), T.denied(work.provider))) + diag(issues),
    'diag-globals': matched({ id:clientGlobal, finds:[check.noemail] }) + drop() + list(twoGlobals, false, null, { conn:{} }) + diag([git002(2, clientGlobal), git001(clientGlobal, 'warning')], true),
    overlap: overlap() + matched({ id:client, path:'~/work/client/app' }) + drop() + list(),
    covered: matched({ covered:true }) + drop() + list(),
    undo: matched({ id:workBound, path:'~/scratch/notes', exact:true, foot:undoBar(work) }) + drop() + list(swap(noGlobal, work, workBound)),
    stale: stale('~/projects/api-old', '~/projects/api') + noMatch(false, { path:'~/projects/api', work:staleRename }) + drop() + list(swap(noGlobal, work, staleRename)),
    'stale-moved': stale(staleMoved.scope[0].slice(0, -1), '~/projects/payments-gateway') + noMatch(false, { path:'~/projects/payments-gateway', work:staleMoved }) + drop() + list(swap(noGlobal, work, staleMoved)),
    'stale-fixed': matched({ id:staleFixed, path:'~/projects/api', exact:true, ack:true }) + drop() + list(swap(noGlobal, work, staleFixed)),
    'stale-kept': noMatch(false, { path:'~/projects/api', work:staleRename }) + drop() + list(swap(noGlobal, work, staleRename)),
    undone: noMatch(true) + drop() + list(noGlobal),
    nomatch: noMatch(false) + drop() + list(noGlobal),
    notrepo: result('warning', '~/scratch/notes', `<div class="say">${T.notRepo}</div>`) + drop() + list(),
    notfolder: result('warning', '~/Downloads/report.pdf', `<div class="say">${T.notFolder}</div>`) + drop() + list(),
    giterror: result('danger', '~/work/api', `<div class="say danger tight">${T.gitFailed}</div>` + clamp(T.gitReason, T.gitReason, 'why')) + drop() + list(),
  }[state];
}

function buttons(id, options, key) {
  document.getElementById(id).innerHTML = Object.entries(options)
    .map(([value, label]) => `<button data-value="${value}" class="${view[key] === value ? 'on' : ''}">${label}</button>`).join('');
  document.getElementById(id).onclick = e => { const v = e.target.dataset.value; if (v) { view[key] = v; render(); } };
}

// The title row and footer. "Built today" shows only the actions that work in the app now: settings, add and quit.
function chrome(T) {
  const bare = ['loading', 'readonly', 'empty'].includes(view.state), all = view.icons === 'all';
  const tool = (name, glyph, label, pos = '') => `<button class="tool ${pos} ${view.tip === name ? 'pinned' : ''}" data-tip="${label}" aria-label="${label}">${icon[glyph]}</button>`;
  // Add Identity lives in the fixed footer so it stays reachable however long the list is; the empty state has its own button.
  // Check Again has nothing to check without identities, so it goes with Add in the states that have none.
  return {
    head:`<header><h1>Idset</h1>${tool('settings', 'gear', T.settings, 'tip-end tip-below')}</header>`,
    foot:`<footer>${bare ? '' : tool('add', 'plus', T.add, 'tip-start')}<span class="spacer"></span>`
      + (all ? tool('about', 'info', T.about) : '') + (all && !bare ? tool('recheck', 'refresh', T.recheck) : '') + tool('quit', 'power', T.quit, 'tip-end') + `</footer>` };
}

// The product icon's key, as internal/trayicon draws it in a 54 x 36 box: a rounded diamond bow with the Git branch
// cut out, the shaft and two bits. hole is what shows through the branch (none: transparent).
function keyGlyph(fill, hole = 'none') {
  const id = 'k' + Math.random().toString(36).slice(2, 8);
  const branch = `<g stroke-width="2.6" stroke-linecap="round" fill="none"><path d="M14.2 10v16"/><path d="M14.2 20.8Q20.6 16 20.6 14.4"/></g><circle cx="14.2" cy="10" r="2.5"/><circle cx="14.2" cy="26" r="2.5"/><circle cx="20.6" cy="14.4" r="2.5"/>`;
  return `<svg viewBox="0 0 54 36"><defs><mask id="${id}"><rect width="54" height="36" fill="#fff"/><g fill="#000" stroke="#000">${branch}</g></mask></defs>`
    + `<g fill="${fill}" mask="url(#${id})"><rect x="6.1" y="6.1" width="23.8" height="23.8" rx="4.9" transform="rotate(45 18 18)"/><rect x="28" y="13.4" width="25" height="9.2" rx="2.8"/><rect x="39" y="18" width="5" height="10.6" rx="1.6"/><rect x="46.5" y="18" width="5" height="8.6" rx="1.6"/></g>`
    + (hole === 'none' ? '' : `<g fill="${hole}" stroke="${hole}">${branch}</g>`) + `</svg>`;
}

// The tray icon in its three versions: the key alone, and with a warning triangle or an error circle at its lower right,
// 1.5 apart from the key. macOS: a 54 x 36 template, one ink the system tints; the badge's mark and the gap are transparent
// (the strip color here). Windows and Linux: 32 x 32, the key scaled to the width, gray, the badge in Warning or Danger.
function trayIcon(sev, ink, bg, badge, square) {
  const w = square ? 32 : 54, h = square ? 32 : 36, k = square ? 32 / 54 : 1, dy = square ? (32 - 36 * k) / 2 : 0, bk = h / 32;
  const key = keyGlyph(ink).replace('<svg viewBox="0 0 54 36">', '').replace('</svg>', '');
  let out = `<svg class="${square ? 'square' : ''}" viewBox="0 0 ${w} ${h}"><g transform="translate(0 ${dy}) scale(${k})">${key}</g>`;
  if (sev) {
    const shape = sev === 'danger' ? f => `<circle cx="24.5" cy="24.5" r="6.5" ${f}/>` : f => `<path d="M24.5 17.2l7 12.8h-14z" stroke-linejoin="round" ${f}/>`;
    const top = sev === 'danger' ? 21.2 : 21.8, dot = sev === 'danger' ? 27.9 : 28.2, mark = badge === ink ? bg : '#fff';
    out += `<g transform="translate(${w - 32 * bk} 0) scale(${bk})">${shape(`fill="${bg}" stroke="${bg}" stroke-width="3"`)}${shape(`fill="${badge}"`)}`
      + `<path d="M24.5 ${top}v3.6M24.5 ${dot}v.1" stroke="${mark}" stroke-width="1.8" stroke-linecap="round"/></g>`;
  }
  return out + '</svg>';
}

function trayFigure(worst, waiting) {
  const strips = [
    ['macOS', '#ececec', '#000', null], ['', '#2b2b2b', '#fff', null],
    ['Windows / Linux', '#f3f3f3', '#8a8a8a', { warning:'#d97706', danger:'#dc2626' }], ['', '#202020', '#8a8a8a', { warning:'#d97706', danger:'#dc2626' }],
  ];
  const sevs = ['', 'warning', 'danger'];
  const row = ([label, bg, ink, colors]) => (label ? `<div class="hint">${label}</div>` : '') + `<div class="trow">${sevs.map(s => `<div class="strip${s === worst ? ' now' : ''}" style="background:${bg}">${trayIcon(s, ink, bg, s ? (colors ? colors[s] : ink) : '', !!colors)}</div>`).join('')}</div>`;
  return `<div class="trayfig"><h2>Tray icon</h2>${strips.map(row).join('')}<div class="names"><span>正常 Normal</span><span>警告 Warning</span><span>错误 Error</span></div>`
    + `<div class="hint">${waiting ? 'The first round is still running: the icon keeps what it showed and changes once, when every check is done.' : 'The outlined one is this state’s: the worst entry of the summary. An HTTPS remote is not in the summary and leaves it normal.'}</div></div>`;
}

function render() {
  const T = TEXT[view.lang];
  document.documentElement.dataset.scheme = view.scheme;
  document.body.classList.toggle('solid', view.material === 'solid');
  const c = chrome(T);
  const content = panel(view.state, T);
  document.getElementById('stage').innerHTML = `<div class="panel${view.height === 'full' ? ' full' : ''}">${c.head}<div class="content">${content}</div>${c.foot}</div>`
    + (view.state.startsWith('diag-') ? trayFigure((content.match(/data-worst="(\w*)"/) || [])[1] || '', view.state === 'diag-checking') : '');
  buttons('states', STATES, 'state');
  buttons('schemes', { light:'浅色', dark:'深色' }, 'scheme');
  buttons('icons', { all:'All planned', today:'Built today' }, 'icons');
  buttons('materials', { glass:'Glass', solid:'Solid' }, 'material');
  buttons('heights', { fixed:'480', full:'Full' }, 'height');
  buttons('langs', { zh:'中文', en:'English' }, 'lang');
  history.replaceState(null, '', `?state=${view.state}&scheme=${view.scheme}&lang=${view.lang}&icons=${view.icons}&height=${view.height}${view.material === 'solid' ? '&material=solid' : ''}${view.tip ? `&tip=${view.tip}` : ''}`);
}

onkeydown = e => {
  if (e.key !== 'ArrowLeft' && e.key !== 'ArrowRight') return;
  const keys = Object.keys(STATES), i = keys.indexOf(view.state);
  view.state = keys[(i + (e.key === 'ArrowRight' ? 1 : keys.length - 1)) % keys.length];
  render();
};
render();
</script>
</html>
