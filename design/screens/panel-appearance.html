<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Panel, light and dark</title>
<!-- Static comparison of the panel in both appearances, each over its own desktop. Colors are Idset's glass theme in
     design/tokens.md and the rules are copied from panel.html; sizes are the 4 DIP spacing unit at 13 px text.
     No scripts and no external resources. Every state, in both languages and both materials, is in panel.html. -->
<style>
* { box-sizing:border-box }
body { margin:0; padding:24px; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI Variable Text","Segoe UI","PingFang SC","Microsoft YaHei UI",system-ui,sans-serif; font-size:13px; -webkit-font-smoothing:antialiased; background:#e4e4e7; color:#1d1d1f }
.light { color-scheme:light; --material:rgba(246,246,248,.62); --text:#1d1d1f; --muted:#6b6b72; --sep:rgba(60,60,67,.18); --card:rgba(255,255,255,.2); --control:rgba(0,0,0,.05); --hover:rgba(0,0,0,.07); --pressed:rgba(0,0,0,.12); --field:rgba(255,255,255,.22); --accent:#0a7a68; --accent-hover:#086a5a; --accent-text:#ffffff; --accent-soft:rgba(20,184,150,.15); --danger:#c8102e; --warning:#b86e00; --success:#1e7d36; --focus:rgba(10,122,104,.4); --inverse:#1d1d1f; --inverse-text:#f5f5f7; --rim:rgba(255,255,255,.7); --card-rim:rgba(255,255,255,.45); --menu:rgba(250,250,252,.74); }
.dark { color-scheme:dark; --material:rgba(36,36,40,.58); --text:#f5f5f7; --muted:#a3a3ab; --sep:rgba(255,255,255,.12); --card:rgba(255,255,255,.08); --control:rgba(255,255,255,.08); --hover:rgba(255,255,255,.11); --pressed:rgba(255,255,255,.16); --field:rgba(0,0,0,.22); --accent:#4fdcb8; --accent-hover:#72e5c8; --accent-text:#10201c; --accent-soft:rgba(79,220,184,.18); --danger:#ff5c74; --warning:#ffb340; --success:#3ccf62; --focus:rgba(79,220,184,.45); --inverse:#f5f5f7; --inverse-text:#1d1d1f; --rim:rgba(255,255,255,.16); --card-rim:rgba(255,255,255,.06); --menu:rgba(44,44,48,.7); }
h2 { margin:0 0 4px; font-size:16px }
p.note { margin:0 0 20px; font-size:13px; color:#52525b }
.row { display:flex; flex-wrap:wrap; gap:24px; align-items:flex-start }
figure { margin:0 }
figcaption { margin:8px 0 0; font-size:12px; color:#52525b }
/* Each appearance sits on its own simulated desktop; the stripes give the panel's blur something to show. */
.desk { position:relative; isolation:isolate; padding:32px; border-radius:12px; color:var(--text) }
.desk::before { content:""; position:absolute; inset:0; z-index:-1; border-radius:inherit; background:repeating-linear-gradient(45deg,rgba(255,255,255,.1) 0 14px,transparent 14px 40px) }
.desk.light { background:radial-gradient(60% 50% at 15% 20%,#9fd8ff,transparent 70%),radial-gradient(50% 60% at 85% 30%,#b8f0c9,transparent 70%),radial-gradient(60% 60% at 50% 100%,#ffd8a8,transparent 70%),linear-gradient(135deg,#7cc4f5,#a7e3d0 60%,#f6e3b5) }
.desk.dark { background:radial-gradient(60% 50% at 15% 20%,#2b4f8f,transparent 70%),radial-gradient(50% 60% at 85% 30%,#1f5e4a,transparent 70%),radial-gradient(60% 60% at 50% 100%,#6b3a2a,transparent 70%),linear-gradient(135deg,#14213d,#0f2a2a 60%,#2a1a14) }
/* The window: 340 x 480, 16 corners, a light rim on the top edge, the material and the system's shadow. "Reduce transparency" makes it opaque. */
.panel { isolation:isolate; position:relative; width:340px; height:480px; flex:none; display:flex; flex-direction:column; border-radius:16px; overflow:hidden; background:var(--material); box-shadow:inset 0 .5px 0 var(--rim),0 0 0 .5px rgba(0,0,0,.18),0 14px 44px rgba(0,0,0,.22) }
/* The material is drawn under the window rather than on it, so that a translucent element inside can blur the window's content. */
.panel::before { content:""; position:absolute; inset:0; z-index:-1; border-radius:inherit; backdrop-filter:blur(30px) saturate(180%); -webkit-backdrop-filter:blur(30px) saturate(180%) }
/* Chrome: the title row is 44 high, the footer 40, neither with a hairline; icon buttons 26 x 26 and round, 16 glyphs, 4 apart. */
header, footer { display:flex; align-items:center; flex:none }
header { height:44px; gap:8px; padding:0 9px 0 16px }
footer { height:40px; gap:4px; padding:0 8px }
footer .spacer { flex:1 }
h1 { flex:1; margin:0; font-size:15px; letter-spacing:-.01em; font-weight:600 }
.panel button.tool { flex:none; position:relative; width:26px; height:26px; padding:0; display:grid; place-items:center; border:0; border-radius:50%; background:transparent; color:var(--muted); cursor:pointer }
.panel button.tool:hover { background:var(--hover) }
.panel button.tool:active { background:var(--pressed) }
.panel button.tool.pinned { background:var(--hover) }
.tool svg { width:16px; height:16px }
/* Tooltip: Inverse fill, no shadow; shows on hover, or pinned with ?tip=<name>. */
.panel [data-tip] { position:relative }
[data-tip]::after { content:attr(data-tip); position:absolute; z-index:5; display:none; padding:4px 9px; border-radius:8px; background:var(--inverse); color:var(--inverse-text); font-size:12px; font-weight:400; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI Variable Text","Segoe UI","PingFang SC","Microsoft YaHei UI",system-ui,sans-serif; line-height:16px; white-space:normal; width:max-content; max-width:240px; text-align:left; pointer-events:none; bottom:calc(100% + 6px); left:50% ; transform:translateX(-50%) }
[data-tip].tip-start::after { left:0; transform:none }
[data-tip].tip-end::after { left:auto; right:0; transform:none }
[data-tip].tip-below::after { bottom:auto; top:calc(100% + 6px) }
[data-tip]:hover::after, [data-tip].pinned::after { display:block }
/* Content: 12 at the sides, cards 10 apart; a group heading sits 12 above its card. */
.content { flex:1; overflow:auto; padding:4px 12px 12px; display:flex; flex-direction:column; gap:10px }
.content, .scroll, .side .items { scrollbar-width:none }
.content::-webkit-scrollbar, .scroll::-webkit-scrollbar, .side .items::-webkit-scrollbar { display:none }
.content > * { flex-shrink:0 }
.panel button { padding:5px 12px; border:0; border-radius:999px; background:var(--control); color:var(--text); font:inherit }
.panel button.icon { width:28px; padding:5px 0 }
.panel button.text { background:transparent; padding:5px 4px; color:var(--accent); font-weight:500; display:inline-flex; align-items:center; gap:4px; align-self:flex-start }
.panel button.text svg { width:14px; height:14px }
.muted { color:var(--muted) }
.small { font-size:12px }
.mono { font-family:"SF Mono",ui-monospace,Menlo,Consolas,monospace; font-size:11.5px }
/* Drop zone: the accent's 1 px dashed outline at 50% over a 6% tint, 12 corners, a folder glyph, the line and a small primary button. */
.drop { display:flex; align-items:center; gap:10px; height:48px; padding:0 10px 0 12px; border:1px dashed color-mix(in srgb, var(--accent) 50%, transparent); border-radius:12px; background:color-mix(in srgb, var(--accent) 6%, transparent) }
.drop > svg { flex:none; width:20px; height:20px; color:var(--accent) }
.drop .line { flex:1; min-width:0; font-size:12px; color:var(--text); white-space:nowrap; overflow:hidden; text-overflow:ellipsis }
.drop.over { border-width:1.5px; border-style:solid; border-color:var(--accent); background:var(--accent-soft) }
.panel .drop button { flex:none; height:24px; padding:0 10px; font-size:12px; font-weight:500 }
/* Initial badge: the identity's color, solid, the letter in white or near black, whichever reads better on it. */
.avatar { flex:none; display:grid; place-items:center; font-weight:600; color:var(--ink); background:rgb(var(--c)) }

/* Result card: a context line with the folder and its actions, then the answer. Cards are fills, not outlines;
   a card that needs attention adds a 1 DIP inner outline in Warning or Danger. */
.result { border-radius:12px; background:var(--card); box-shadow:inset 0 .5px 0 var(--card-rim) }
.result.warning { box-shadow:inset 0 0 0 1px color-mix(in srgb, var(--warning) 70%, transparent) }
.result.danger { box-shadow:inset 0 0 0 1px color-mix(in srgb, var(--danger) 70%, transparent) }
.result .top { display:flex; align-items:center; gap:4px; height:36px; padding:0 6px 0 12px; border-bottom:.5px solid var(--sep) }
.result .top .cluster { flex:0 1 auto; min-width:0; display:flex; align-items:center; gap:2px }
.result .top .mid { flex:1 0 80px; color:var(--muted) }
.result .copied { flex:0 1 auto; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-size:11px; color:var(--muted); margin-right:2px }
/* The answer: one block of two lines beside a 32 badge, the identity's name over the dropped folder, then one muted line
   with the email and the alias, lined up with the name (12 + 32 + 10 = 54). The actions sit at the end of the first line. */
.result .answer { display:flex; align-items:center; gap:10px; padding:10px 6px 0 12px }
.result .answer .avatar { width:32px; height:32px; border-radius:9px; font-size:15px }
.result .answer .lines { flex:1; min-width:0; display:flex; flex-direction:column; gap:1px }
.result .answer .cluster { flex:none; align-self:flex-start; display:flex; align-items:center; gap:2px }
.result .name { font-size:14px; font-weight:600; align-self:flex-start; max-width:100%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap }
.result .answer .mid { color:var(--muted) }
.result .meta { display:flex; min-width:0; padding:6px 12px 10px 54px; font-size:12px; color:var(--muted); white-space:pre }
.result .meta > span { min-width:0; overflow:hidden; text-overflow:ellipsis }
.result .meta > .mono { flex:none }
.panel button.tool[aria-expanded="true"] { background:var(--hover); color:var(--text) }
/* Dragging a folder over the panel while a result shows: the content takes the drop zone's look and says what releasing does. */
.dropover { position:absolute; z-index:3; top:44px; left:8px; right:8px; bottom:46px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:8px; border:1.5px solid color-mix(in srgb, var(--accent) 70%, transparent); border-radius:14px; background:color-mix(in srgb, var(--accent-soft) 60%, var(--menu)); backdrop-filter:blur(16px) saturate(180%); -webkit-backdrop-filter:blur(16px) saturate(180%); box-shadow:inset 0 .5px 0 var(--rim); font-weight:600 }
.dropover svg { width:28px; height:28px; color:var(--accent) }
.result .finds { border-top:.5px solid var(--sep); padding:4px 0 }
.result .find { display:flex; align-items:center; gap:6px; height:28px; padding:0 12px; font-size:12px }
.result .find > svg { flex:none; width:14px; height:14px }
.result .find.warning > svg { color:var(--warning) }
.result .find.danger > svg { color:var(--danger) }
.find .says { flex:1 1 auto; min-width:0; display:flex; white-space:pre }
.find .says > span { flex:none }
.find .says > .give { flex:0 1 auto; min-width:0; overflow:hidden; text-overflow:ellipsis }
.find .says > .mid { flex:0 1 auto }
.result .find.remote { padding-right:6px }
.find.remote .says { align-items:center; gap:6px }
.find.remote .says > svg { flex:none; width:14px; height:14px; color:var(--muted) }
.ack { flex:none; font-size:11px; color:var(--muted); white-space:nowrap }
.panel button.tool:disabled { opacity:.4; cursor:default; background:transparent }
.clone { display:flex; flex-direction:column; gap:4px; padding:8px 12px 10px }
.result .clone { border-top:.5px solid var(--sep) }
.clone .line { display:flex; align-items:center; gap:4px }
.clone .inputwrap { flex:1; min-width:0; display:flex }
.panel input.field { width:100%; height:28px; padding:0 10px; border:.5px solid var(--sep); border-radius:8px; outline:0; background:var(--field); color:var(--text); font-family:"SF Mono",ui-monospace,Menlo,Consolas,monospace; font-size:11.5px }
.panel input.field::placeholder { color:var(--muted) }
.panel input.field.focus, .panel input.field:focus { box-shadow:0 0 0 3px var(--focus); border-color:var(--accent) }
.clone .out { display:flex; align-items:center; height:16px; padding:0 2px; font-size:11px; color:var(--muted) }
.clone .out .mid { flex:1 1 0; font-size:11px }
.clone .out .hint { white-space:nowrap; overflow:hidden; text-overflow:ellipsis }
/* Expanded identity row: the helper sits inside the list under its row, lined up with the name (12 + 28 badge + 10 = 50). */
.list .clone { padding:0 12px 10px 50px }
.item .chev { transform:rotate(-90deg) }
.item.open .chev { transform:none }
.item .gap { flex:none; width:26px }
.result .say { padding:12px; display:flex; align-items:center; gap:8px; font-weight:600 }
.result .say.plain { font-weight:400 }
.result .say.danger { color:var(--danger); font-weight:600 }

/* Binding. Rows are 44 high, buttons 28 high and 80 wide, so a label never resizes a control. */
.panel button.field { background:var(--control) }
.panel button.fixed { width:80px; height:28px; padding:0; text-align:center }
.panel button.primary { background:var(--accent); color:var(--accent-text); font-weight:500 }
.result .head { padding:0 12px 6px; font-size:11px; font-weight:600; color:var(--muted) }
.result .say.tight { padding-bottom:8px }
.result .say .tool { margin-left:auto }
.result .why { padding:0 12px 12px; font-family:"SF Mono",ui-monospace,Menlo,Consolas,monospace; font-size:11px; color:var(--muted) }
.why span, .reason span { display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; overflow-wrap:anywhere }
.result .row { position:relative; display:flex; align-items:center; gap:10px; height:44px; padding:0 12px }
.result .row::before { content:""; position:absolute; top:0; left:12px; right:0; border-top:.5px solid var(--sep) }
.result .row.short { height:40px; padding:0 8px }
.result .row .dot { flex:none; width:10px; height:10px; border-radius:50%; background:rgb(var(--c)) }
.dark .result .row .dot { background:rgb(var(--cl)) }
.result .row .lines { flex:1; min-width:0; display:flex; flex-direction:column; gap:1px }
.result .row .label { font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap }
.result .row .note { display:flex; font-size:12px; color:var(--muted) }
.result .row .note > span { white-space:pre }
.result .row .go { flex:none; width:44px; text-align:right; color:var(--accent); font-weight:500 }
.result .row.lost .label { color:var(--muted); font-weight:400 }
.result .row .verdict { flex:none; display:flex; align-items:center; gap:4px; font-size:12px; color:var(--muted) }
.result .row .verdict.win { color:var(--accent); font-weight:600 }
.result .row .verdict svg { width:14px; height:14px }
.result .confirm { border-top:.5px solid var(--sep); padding:12px; display:flex; flex-direction:column; gap:10px }
.result .confirm p { margin:0; line-height:1.45 }
.result .buttons { display:flex; justify-content:flex-end; gap:8px }
.result button.text { align-self:center }
.result .actions { display:flex; align-items:center; justify-content:flex-end; gap:4px; height:36px; padding:0 8px; border-top:.5px solid var(--sep) }
.result .menuwrap { position:relative; display:flex }
.panel button.text.quiet { color:var(--muted) }
/* A native system menu (the same for every pop-up), as macOS 26 draws it: Liquid Glass, 12 corners, 24 px items with 7 corners, the accent on the highlighted one. */
.menu { position:absolute; z-index:4; top:calc(100% + 6px); right:0; min-width:188px; padding:6px; border-radius:12px; background:var(--menu); backdrop-filter:blur(36px) saturate(200%); -webkit-backdrop-filter:blur(36px) saturate(200%); box-shadow:inset 0 .5px 0 var(--rim),0 0 0 .5px rgba(0,0,0,.12),0 12px 32px rgba(0,0,0,.18) }
.menu .mhead { height:22px; padding:0 10px; display:flex; align-items:center; font-size:11px; font-weight:600; color:var(--muted) }
.menu .msep { height:.5px; margin:5px 10px; background:var(--sep) }
.menu .entry { display:flex; align-items:center; height:24px; padding:0 10px; border-radius:7px; font-size:13px; white-space:nowrap }
.menu .entry.hot { background:var(--accent); color:var(--accent-text) }
.result .bar { position:relative; display:flex; align-items:center; gap:0; min-height:36px; padding:8px 12px; border-top:.5px solid var(--sep); line-height:1.4 }
.result .bar.timed { height:36px; padding:0 8px 0 12px; border-radius:0 0 12px 12px; overflow:hidden }
/* The countdown: a 2 DIP line on the bottom edge of the bar, as wide as the time left of the card's width (here 3 of 5 seconds), Accent at 45%. */
.result .bar.timed::after { content:""; position:absolute; left:0; bottom:0; height:2px; width:var(--left); background:color-mix(in srgb, var(--accent) 45%, transparent) }
.result .bar button.text { padding:5px 4px }
.result .stale-head { display:flex; align-items:center; gap:10px; height:40px; padding:0 12px }
.result .stale-head .dot { flex:none; width:10px; height:10px; border-radius:50%; background:rgb(var(--c)) }
.dark .result .stale-head .dot { background:rgb(var(--cl)) }
.result .stale-head .rest { flex:1 1 auto; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap }
.result .stale-head .name { font-weight:600 }
.result .path-row.old { border-top:.5px solid var(--sep) }
.result .path-row { display:flex; align-items:center; gap:6px; height:28px; padding:0 12px; }
.result .path-row.old .mid { color:var(--muted) }
.path-row > svg { flex:none; width:14px; height:14px; color:var(--muted) }
/* Middle truncation: the start of a path ("~/", "/" or a drive) and its last folder (and any suffix) never shrink; what lies between takes the ellipsis. */
.mid { position:relative; display:flex; min-width:0; white-space:pre; font-family:"SF Mono",ui-monospace,Menlo,Consolas,monospace; font-size:11.5px }
.mid .ml { flex:none }
.mid .mh { min-width:0; overflow:hidden; text-overflow:ellipsis }
.mid .mt { flex:none }
.result .path-row .mid { flex:1 1 0 }
.panel.full { height:auto; min-height:480px }
.panel .content { min-height:0 }

/* Identity list: a group heading with the count, then one card; rows carry the initial badge, hairlines start at the name. */
.section { padding:6px 6px 0; margin-bottom:-4px; font-size:11px; font-weight:600; color:var(--muted); letter-spacing:.02em }
.list { border-radius:12px; background:var(--card); box-shadow:inset 0 .5px 0 var(--card-rim); overflow:hidden }
.item { position:relative; display:flex; align-items:center; gap:10px; padding:8px 6px 8px 12px; min-height:48px }
.item:hover { background:var(--hover) }
.list > .item:not(:first-child)::before { content:""; position:absolute; top:0; left:50px; right:0; border-top:.5px solid var(--sep) }
.item .avatar { width:28px; height:28px; border-radius:8px; font-size:13px }
.item .text { flex:1; min-width:0; display:flex; flex-direction:column; gap:1px }
.item .label { font-weight:600; font-size:13px }
.item .label, .item .email { overflow:hidden; text-overflow:ellipsis; white-space:nowrap }
.item .email { font-size:12px; color:var(--muted) }
.item .tag { flex:none; max-width:42%; display:flex; font-family:"SF Mono",ui-monospace,Menlo,Consolas,monospace; font-size:11px; color:var(--muted) }
.item .tag .mid { font-size:inherit; min-width:0 }
.result .row .note .mid { font-family:"SF Mono",ui-monospace,Menlo,Consolas,monospace; font-size:11px }

/* Filter: a capsule search field with a magnifier, as macOS 26 draws one; focus is the same soft ring as a text field. */
.search { position:relative; display:flex; align-items:center; height:28px }
.search svg { position:absolute; left:10px; width:13px; height:13px; color:var(--muted); pointer-events:none }
.search input { width:100%; height:100%; padding:0 10px 0 29px; border:0; border-radius:999px; background:var(--control); color:var(--text); font:inherit; outline:0 }
.search input:focus { box-shadow:0 0 0 3px var(--focus) }
.search input::placeholder { color:var(--muted) }
.chips { display:flex; gap:6px }
.panel .chip { height:24px; padding:0 10px; border-radius:12px; font-size:12px }
.panel .chip.on { background:var(--accent); color:var(--accent-text); font-weight:500 }
.center { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:8px; text-align:center }
.error { color:var(--danger) }
.spinner { width:16px; height:16px; flex:none; border:2px solid var(--sep); border-top-color:var(--accent); border-radius:50% }
.center .spinner { width:20px; height:20px }
/* accounts.json cannot be read: nothing else can be done, so the error takes the whole panel. */
.readonly { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:8px; text-align:center; padding:0 8px }
.readonly .warn { width:48px; height:48px; border-radius:12px; display:grid; place-items:center; color:var(--danger); background:color-mix(in srgb, var(--danger) 14%, transparent) }
.readonly .warn svg { width:24px; height:24px }
.readonly .title { font-size:15px; font-weight:600 }
.readonly .path { font-family:"SF Mono",ui-monospace,Menlo,Consolas,monospace; font-size:11.5px; color:var(--muted) }
.readonly .reason { width:100%; font-family:"SF Mono",ui-monospace,Menlo,Consolas,monospace; font-size:11px; color:var(--muted); overflow-wrap:anywhere }
.readonly .hint { font-size:12px; color:var(--muted) }
.readonly .actions { display:flex; flex-wrap:wrap; justify-content:center; gap:8px; margin-top:8px }
.panel button.fixed.wide { width:120px }
.panel button.fixed.full { width:248px }
.panel button.pad { height:28px; padding:0 16px; margin-top:4px }
/* Empty: the product icon's key in a tinted tile, the title, the hint, Add and Import. */
.hero { width:56px; height:56px; border-radius:16px; display:grid; place-items:center; background:var(--accent-soft); color:var(--accent); margin-bottom:4px }
.hero svg { width:34px; height:24px }
.center .big { font-size:15px }
/* Diagnostics. The connectivity dot: 7 across in a 14 DIP slot: Success, Danger, or a Muted ring until the first round ends. */
.item .conn { flex:none; width:14px; height:14px; display:grid; place-items:center }
.item .conn::before { content:""; width:7px; height:7px; border-radius:50%; box-sizing:border-box }
.item .conn.ok::before { background:var(--success) }
.item .conn.fail::before { background:var(--danger) }
.item .conn.pending::before { border:1.5px solid var(--muted) }
/* Problem bar: under its row inside the list, lined up with the name (50) like the clone helper. */
.list .problem { display:flex; flex-direction:column; padding:0 6px 8px 50px; margin-top:-6px }
.problem .pline { display:flex; align-items:center; gap:6px; height:28px; font-size:12px }
.problem .pline > svg { flex:none; width:14px; height:14px }
.problem.danger .pline > svg { color:var(--danger) }
.problem.quiet .pline > svg { color:var(--muted) }
.problem .says { flex:1 1 auto; min-width:0; display:flex; white-space:pre }
.problem .says > span { flex:none }
.problem .says > .mid { flex:0 1 auto; font-size:11px }
.problem .pact { display:flex; align-items:center; gap:12px; height:24px; padding-left:20px }
.problem .pact button.text { padding:2px 0; font-size:12px }
.problem .pact button.tool:first-child { margin-left:-4px }
.problem .hint { padding:0 4px 4px 20px; font-size:12px; color:var(--muted); line-height:1.4 }
.problem .cmd { display:flex; align-items:center; gap:4px; height:28px; padding-left:20px }
.problem .cmd .mid { flex:1 1 0; font-size:11px; color:var(--muted) }
.result.notice { padding:0 6px 6px 12px }
.result.notice .pline { font-size:13px; font-weight:600 }
.result.notice .hint { padding-left:20px }
/* Diagnostics summary: the last block of the content. Healthy: one muted line. Otherwise a card whose 32 DIP heading opens one entry per problem. */
.okline { display:flex; align-items:center; gap:6px; padding:0 6px; font-size:12px; color:var(--muted) }
.okline svg { width:14px; height:14px; color:var(--success) }
.summary { border-radius:12px; background:var(--card); box-shadow:inset 0 .5px 0 var(--card-rim); overflow:hidden }
.summary .shead { display:flex; align-items:center; gap:6px; height:32px; padding:0 8px 0 12px; font-size:12px; font-weight:600 }
.summary .shead > svg { flex:none; width:14px; height:14px }
.summary .shead .count { flex:1 }
.summary .shead .chev { transform:rotate(-90deg); color:var(--muted) }
.summary.open .shead .chev { transform:none }
.summary .entry { display:flex; align-items:flex-start; gap:6px; padding:8px 12px; border-top:.5px solid var(--sep); font-size:12px }
.summary .entry > svg { flex:none; width:14px; height:14px; margin-top:1px }
.summary .entry .lines { flex:1; min-width:0; display:flex; flex-direction:column; gap:2px; line-height:1.4 }
.summary .entry .how { color:var(--muted) }
.summary .entry .code { flex:none; font-family:"SF Mono",ui-monospace,Menlo,Consolas,monospace; font-size:11px; color:var(--muted); margin-top:1px }
.summary .entry button.text { padding:2px 0; font-size:12px }
.summary .warning > svg, .problem.warning .pline > svg { color:var(--warning) }
.summary .danger > svg { color:var(--danger) }
/* The tray icon beside the panel in the diagnostics states: not part of the panel, drawn like the controls. */
.trayfig { width:300px; flex:none; display:flex; flex-direction:column; gap:10px; padding:14px; border-radius:10px; background:#f4f4f4; color:#242424; font-size:12px }
.trayfig h2 { margin:0; font-size:11px; font-weight:600; text-transform:uppercase; letter-spacing:.04em; color:#666 }
.trayfig .trow { display:grid; grid-template-columns:repeat(3, 1fr); gap:6px }
.trayfig .strip { display:grid; place-items:center; height:44px; border-radius:6px }
.trayfig .strip svg { height:24px }
.trayfig .strip svg.square { width:32px; height:32px }
.trayfig .strip.now { outline:2px solid #006fdf; outline-offset:1px }
.trayfig .names { display:grid; grid-template-columns:repeat(3, 1fr); gap:6px; text-align:center; color:#666 }
.trayfig .hint { color:#666; line-height:1.5 }
.panel button.tool.focus { box-shadow:0 0 0 3px var(--focus); color:var(--text) }
