<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Settings window</title>
<style>
/* Colors are Idset's glass theme in design/tokens.md, sizes the 4 DIP spacing unit at 13 px text. The window draws no
   background of its own beyond the Window material (simulated here by .win over the desktop); groups are translucent
   cards, rows are separated by .5 hairlines, nothing has a border. */
:root { color-scheme:light; --material:rgba(246,246,248,.62); --text:#1d1d1f; --muted:#6b6b72; --sep:rgba(60,60,67,.18); --card:rgba(255,255,255,.2); --control:rgba(0,0,0,.05); --hover:rgba(0,0,0,.07); --pressed:rgba(0,0,0,.12); --field:rgba(255,255,255,.22); --accent:#0a7a68; --accent-hover:#086a5a; --accent-text:#ffffff; --accent-soft:rgba(20,184,150,.15); --danger:#c8102e; --warning:#b86e00; --success:#1e7d36; --focus:rgba(10,122,104,.4); --inverse:#1d1d1f; --inverse-text:#f5f5f7; --rim:rgba(255,255,255,.7); --card-rim:rgba(255,255,255,.45); --menu:rgba(250,250,252,.74); }
:root[data-scheme=dark] { color-scheme:dark; --material:rgba(36,36,40,.58); --text:#f5f5f7; --muted:#a3a3ab; --sep:rgba(255,255,255,.12); --card:rgba(255,255,255,.08); --control:rgba(255,255,255,.08); --hover:rgba(255,255,255,.11); --pressed:rgba(255,255,255,.16); --field:rgba(0,0,0,.22); --accent:#4fdcb8; --accent-hover:#72e5c8; --accent-text:#10201c; --accent-soft:rgba(79,220,184,.18); --danger:#ff5c74; --warning:#ffb340; --success:#3ccf62; --focus:rgba(79,220,184,.45); --inverse:#f5f5f7; --inverse-text:#1d1d1f; --rim:rgba(255,255,255,.16); --card-rim:rgba(255,255,255,.06); --menu:rgba(44,44,48,.7); }
* { box-sizing:border-box }
body { margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI Variable Text","Segoe UI","PingFang SC","Microsoft YaHei UI",system-ui,sans-serif; font-size:13px; -webkit-font-smoothing:antialiased; color:var(--text); display:flex; gap:24px; padding:24px; align-items:flex-start; min-height:100vh;
  background:radial-gradient(60% 50% at 15% 20%,#9fd8ff,transparent 70%),radial-gradient(50% 60% at 85% 30%,#b8f0c9,transparent 70%),radial-gradient(60% 60% at 50% 100%,#ffd8a8,transparent 70%),linear-gradient(135deg,#7cc4f5,#a7e3d0 60%,#f6e3b5) }
:root[data-scheme=dark] body { background:radial-gradient(60% 50% at 15% 20%,#2b4f8f,transparent 70%),radial-gradient(50% 60% at 85% 30%,#1f5e4a,transparent 70%),radial-gradient(60% 60% at 50% 100%,#6b3a2a,transparent 70%),linear-gradient(135deg,#14213d,#0f2a2a 60%,#2a1a14) }
/* Stripes on the desktop, so the blur behind the window shows. */
body::before { content:""; position:fixed; inset:0; z-index:-1; background:repeating-linear-gradient(45deg,rgba(255,255,255,.1) 0 14px,transparent 14px 40px) }
.controls { width:220px; flex:none; display:flex; flex-direction:column; gap:14px; padding:14px; border-radius:10px; background:#f4f4f4; color:#242424; font-size:12px }
.controls h2 { margin:0 0 6px; font-size:11px; font-weight:600; text-transform:uppercase; letter-spacing:.04em; color:#666 }
.controls .group { display:flex; flex-wrap:wrap; gap:4px }
.controls button { padding:4px 8px; border:1px solid #ccc; border-radius:5px; background:#fff; color:#242424; font:inherit; cursor:pointer }
.controls button.on { background:#006fdf; border-color:#006fdf; color:#fff }
.controls .hint { color:#666; line-height:1.5 }
.controls kbd { padding:0 4px; border:1px solid #ccc; border-radius:3px; background:#fff; font-size:11px }

/* Window: 720x480, 16 corners with a light rim, the material and the system's shadow; the system title bar, a toolbar of tabs (one per
   pane) under it, then the pane. "Reduce transparency" makes it opaque. */
.win { isolation:isolate; position:relative; width:720px; height:480px; flex:none; display:flex; flex-direction:column; border-radius:16px; overflow:hidden; background:var(--material); box-shadow:inset 0 .5px 0 var(--rim),0 0 0 .5px rgba(0,0,0,.18),0 14px 44px rgba(0,0,0,.24) }
/* The material is drawn under the window rather than on it, so that a translucent element inside can blur the window's content. */
.win::before { content:""; position:absolute; inset:0; z-index:-1; border-radius:inherit; backdrop-filter:blur(30px) saturate(180%); -webkit-backdrop-filter:blur(30px) saturate(180%) }
.solid .win { background:#f2f2f5 }
.solid .win::before { display:none }
:root[data-scheme=dark] .solid .win { background:#2a2a2e }
.band { flex:none; border-bottom:.5px solid var(--sep) }
.titlebar { height:28px; display:grid; place-items:center; font-size:11px; color:var(--muted) }
/* macOS draws the window buttons in the transparent title bar; the mockup shows them so the space above the content reads as the title bar. */
.titlebar { position:relative }
.lights { position:absolute; left:9px; top:8px; display:flex; gap:8px }
.lights i { width:12px; height:12px; border-radius:50%; box-shadow:inset 0 0 0 .5px rgba(0,0,0,.15) }
.lights i:nth-child(1) { background:#ff5f57 } .lights i:nth-child(2) { background:#febc2e } .lights i:nth-child(3) { background:#28c840 }
.lights.fixed i:nth-child(n+2) { background:rgba(128,128,128,.35) }
.tabs { display:flex; justify-content:center; gap:4px; padding:4px 8px 6px }
.tab { width:88px; height:52px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px; border-radius:8px; font-size:11px; color:var(--muted) }
.tab:hover { background:var(--hover) }
.tab svg { width:20px; height:20px }
.tab.sel { background:var(--accent-soft); color:var(--accent); font-weight:500 }
.body { flex:1; min-height:0; display:flex }
.detail { flex:1; min-width:0; display:flex; flex-direction:column }
.scroll { flex:1; min-height:0; overflow:auto; padding:16px 20px 20px; display:flex; flex-direction:column; gap:20px }
.content, .scroll, .side .items { scrollbar-width:none }
.content::-webkit-scrollbar, .scroll::-webkit-scrollbar, .side .items::-webkit-scrollbar { display:none }
.scroll > * { flex-shrink:0; width:100%; max-width:560px; margin-inline:auto }
.scroll.busy { opacity:.5; pointer-events:none }
.foot { flex:none; display:flex; align-items:center; gap:8px; min-height:44px; box-sizing:border-box; padding:0 20px; border-top:.5px solid var(--sep) }
.status { flex:1; min-width:0; font-size:12px; color:var(--muted); display:flex; align-items:center; gap:6px; overflow-wrap:anywhere }
.status.error { color:var(--danger) }
.status svg { width:12px; height:12px; flex:none }

/* Buttons: --control fill, no border; primary (the only accent fill), destructive, and text. */
button { padding:0 12px; height:24px; border:0; border-radius:999px; background:var(--control); color:var(--text); font:inherit; display:inline-flex; align-items:center; gap:4px; white-space:nowrap }
button:hover:not(:disabled) { background:var(--hover) }
/* Footer buttons: one height, and Revert and Save one width, so a label change moves nothing. */
.foot button { height:28px }
.foot button:not(.text) { width:100px; justify-content:center }
button.primary { background:var(--accent); color:var(--accent-text); font-weight:500 }
button.primary:hover:not(:disabled) { background:var(--accent-hover) }
button.destructive { background:var(--danger); color:#fff; font-weight:500 }
button.text { background:transparent; padding:0 8px; color:var(--accent); font-weight:500 }
button.text:hover:not(:disabled) { background:var(--hover) }
button.text.danger { color:var(--danger) }
button:disabled { opacity:.4 }
button svg { width:12px; height:12px }
button.ghost { width:24px; padding:0; justify-content:center; background:transparent; color:var(--muted) }
button.ghost svg { width:14px; height:14px }
.muted { color:var(--muted) }
.mono { font-family:"SF Mono",ui-monospace,Menlo,Consolas,monospace; font-size:11.5px }
.spinner { width:12px; height:12px; flex:none; border:2px solid var(--sep); border-top-color:var(--accent); border-radius:50% }

.dot { flex:none; width:10px; height:10px; border-radius:50%; background:rgb(var(--c)) }
:root[data-scheme=dark] .dot { background:rgb(var(--cl)) }

/* Header. */
.head { display:flex; align-items:center; gap:8px; flex-wrap:wrap }
.head .dot { width:12px; height:12px }
.head h2 { margin:0; font-size:15px; font-weight:600; overflow-wrap:anywhere }
.head .mark { font-size:12px; color:var(--muted) }
.head .sp { flex:1 }
.choices { display:flex; align-items:center; gap:8px }
.choice { width:14px; height:14px; border-radius:50%; background:rgb(var(--c)); display:grid; place-items:center; color:#fff }
.choice.on { outline:1.5px solid rgb(var(--c)); outline-offset:2px }
.choice svg { width:9px; height:9px }
.choices .mono { margin-left:4px; color:var(--muted); font-size:11px }

/* Groups: a heading, then a card of rows (label left, value right) with inset .5 hairlines, then a footnote. */
.g > h3 { margin:0 0 4px 12px; font-size:11px; font-weight:600; color:var(--muted) }
.rows { background:var(--card); border-radius:12px; box-shadow:inset 0 .5px 0 var(--card-rim) }
.r { position:relative; display:flex; align-items:center; gap:12px; min-height:32px; padding:4px 12px }
.r + .r::before { content:""; position:absolute; top:0; left:12px; right:0; height:.5px; background:var(--sep) }
.r .k { flex:none; width:168px }
.r .k.wide { width:auto; flex:1 }
.r .hint-end { flex:none; font-size:12px; color:var(--muted) }
.r .v { flex:1; min-width:0; text-align:right; overflow-wrap:anywhere }
.r .v.ph { color:var(--muted) }
.r .v.left { text-align:left }
.r .v.focus { padding:2px 8px; border:.5px solid var(--accent); border-radius:8px; background:var(--field); box-shadow:0 0 0 3px var(--focus) }
.r .v.sel { display:flex; align-items:center; justify-content:flex-end; gap:4px }
.r .v.sel svg { width:10px; height:10px; color:var(--muted) }
.r .tail { flex:none; display:flex; align-items:center; gap:4px }
.r.add { padding-left:4px }
.note { margin:4px 12px 0; font-size:12px; line-height:1.4; color:var(--muted) }
.note.err { color:var(--danger); display:flex; gap:4px }
.note.err svg { width:12px; height:12px; flex:none; margin-top:1px }
.seg { display:inline-flex; padding:2px; gap:2px; border-radius:7px; background:var(--control) }
.seg span { padding:2px 12px; border-radius:5px; font-size:12px }
.seg span.on { background:#fff; box-shadow:0 .5px 1.5px rgba(0,0,0,.2) }
:root[data-scheme=dark] .seg span.on { background:rgba(255,255,255,.18) }
.radios { display:inline-flex; gap:16px }
.radio { display:inline-flex; align-items:center; gap:6px }
.radio i { width:14px; height:14px; border:1.5px solid var(--muted); border-radius:50%; display:grid; place-items:center }
.radio.on i { border-color:var(--accent) }
.radio.on i::after { content:""; width:6px; height:6px; border-radius:50%; background:var(--accent) }
.check { display:inline-flex; align-items:center; gap:8px }
.check i { width:14px; height:14px; border:1.5px solid var(--muted); border-radius:4px; display:grid; place-items:center; color:var(--accent-text) }
.check.on i { background:var(--accent); border-color:var(--accent) }
.check i svg { width:10px; height:10px }
.check.off { opacity:.45 }
.switch { flex:none; width:28px; height:16px; border-radius:8px; background:var(--pressed); position:relative }
.switch::after { content:""; position:absolute; top:2px; left:2px; width:12px; height:12px; border-radius:50%; background:#fff; box-shadow:0 .5px 1.5px rgba(0,0,0,.3) }
.switch.on { background:var(--accent) }
.switch.on::after { left:14px }
:root[data-scheme=dark] .switch.on::after { background:var(--accent-text) }
.rw { flex:1; min-width:0; display:flex; flex-direction:column; gap:1px }
.rw .to { color:var(--muted) }
.push { font-size:12px; color:var(--muted) }

.center { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px; text-align:center; padding:0 24px }
.center strong { font-size:15px; font-weight:600 }
.center .acts { display:flex; gap:8px; margin-top:16px }

/* Confirmations: a card on the Menu material over the dimmed window. */
/* A dialog is a separate frameless child window on the system material (popover), which macOS 26 draws as Liquid Glass: 16
   corners, a light rim along the top, capsule buttons. No scrim dims the parent. */
.scrim { position:absolute; inset:0; display:flex; align-items:center; justify-content:center }
.dialog { width:340px; display:flex; flex-direction:column; gap:12px; padding:20px; background:var(--menu); backdrop-filter:blur(36px) saturate(200%); -webkit-backdrop-filter:blur(36px) saturate(200%); border-radius:16px; box-shadow:inset 0 .5px 0 var(--rim),0 0 0 .5px rgba(0,0,0,.18),0 14px 44px rgba(0,0,0,.24) }
.dialog h2 { margin:0; font-size:13px; font-weight:600; overflow-wrap:anywhere }
.dialog p { margin:0; line-height:1.45 }
.dialog .kv { display:grid; grid-template-columns:64px 1fr; gap:4px 8px; padding:8px 0; border-top:.5px solid var(--sep); border-bottom:.5px solid var(--sep); font-size:12px }
.dialog .kv > :nth-child(odd) { color:var(--muted) }
.dialog .kv .paths { display:flex; flex-direction:column; gap:2px }
.dialog .small { font-size:12px; color:var(--muted) }
.dialog .opt { display:flex; flex-direction:column; gap:4px }
.dialog .opt .small { padding-left:22px }
.dialog .buttons { display:flex; gap:8px; margin-top:6px }
.dialog .buttons button { flex:1; height:28px; justify-content:center }

/* Settings additions: the pane heading, backup rows, notes in the warning color. */
.note.warn { color:var(--warning); display:flex; gap:4px }
.note.warn svg { width:12px; height:12px; flex:none; margin-top:1px }
.note.ok { color:var(--muted); display:flex; gap:4px }
.note.ok svg { width:12px; height:12px; flex:none; margin-top:1px; color:var(--accent) }
.r .tickend { flex:none; width:14px; height:14px; color:var(--accent) }
.r.pick .k { flex:1; width:auto }
.r.bk { min-height:44px; padding:6px 12px 6px 4px }
.r.bk .t { flex:1; min-width:0; display:flex; flex-direction:column; gap:1px }
.r.bk .t .sub { font-size:12px; color:var(--muted); overflow-wrap:anywhere }
.r.bk .t .sub.bad { color:var(--danger) }
.r.bk .acts { flex:none; display:flex; align-items:center; gap:2px }
.r.bk .acts .muted { font-size:12px; margin-right:4px }
.r.bk .slot { width:24px; height:24px; flex:none; display:flex; align-items:center; justify-content:center }
.r.bk .slot.ok { color:var(--accent) }
.r.bk .slot svg { width:14px; height:14px }
.r.bk.busy { opacity:.5 }
.r.idr { min-height:32px; padding-left:44px; gap:8px }
.r.idr .nm { flex:none }
.r.idr .em { flex:1; min-width:0; font-size:12px; color:var(--muted); overflow-wrap:anywhere }
.r.idr .trail { flex:none; min-width:24px; display:flex; justify-content:center; color:var(--muted) }
.r.idr .trail.txt { justify-content:flex-end; padding-right:5px; font-size:12px }
.r.idr .trail svg { width:14px; height:14px }
.r.err { display:block; min-height:0; padding:6px 12px 8px 44px }
.banner { display:flex; gap:8px; align-items:flex-start; padding:10px 12px; border-radius:12px; background:color-mix(in srgb, var(--danger) 12%, transparent); line-height:1.4 }
.banner svg { width:14px; height:14px; flex:none; margin-top:2px; color:var(--danger) }
.dialog .ids { display:flex; flex-direction:column; gap:6px; padding:8px 0; border-top:.5px solid var(--sep); border-bottom:.5px solid var(--sep) }
.dialog .ids .li { display:flex; align-items:center; gap:8px }
.dialog .ids .li .em { font-size:12px; color:var(--muted) }
.dialog .sec { display:flex; flex-direction:column; gap:6px; padding:10px 12px; border-radius:8px; background:var(--control) }
.dialog .sec h3 { margin:0 0 2px; font-size:11px; font-weight:600; color:var(--muted) }
.dialog .sec .li { display:flex; align-items:center; gap:8px; line-height:1.35 }
.dialog .sec .li svg { width:12px; height:12px; flex:none }
.dialog .sec .gone svg { color:var(--danger) }
.dialog .sec .kept svg { color:var(--muted) }

/* Keys: the form, its action row, the public key text, the next steps, the identity picker. */
.banner.info { background:var(--card) }
.banner.info svg { color:var(--muted) }
.actrow { display:flex; justify-content:flex-end; align-items:center; gap:8px }
.actrow .muted { font-size:12px }
.actrow.split { justify-content:space-between }
.scroll.form-busy .g { opacity:.5 }
.keyhead { display:flex; align-items:center; gap:8px }
.keyhead svg { width:16px; height:16px; color:var(--accent); flex:none }
.keyhead h2 { margin:0; font-size:15px; font-weight:600 }
.keyhead .mark { font-size:12px; color:var(--muted) }
.r.keytext { display:block; padding:8px 12px; line-height:1.45; word-break:break-all; user-select:text }
.r .v.mono, .r .k.mono { font-size:11.5px }
.files .r .k { width:96px }
.r .tail .ok { display:inline-flex; align-items:center; gap:4px; font-size:12px; color:var(--muted) }
.r .tail .ok svg { width:12px; height:12px; color:var(--accent) }
.r .tail .who { display:inline-flex; align-items:center; gap:6px }
.r .tail .who .dot { width:8px; height:8px }
.dialog .picks { display:flex; flex-direction:column; padding:4px 0; border-top:.5px solid var(--sep); border-bottom:.5px solid var(--sep) }
.dialog .picks .pk { display:flex; align-items:flex-start; gap:8px; padding:5px 0 }
.dialog .picks .pk .radio { margin-top:1px }
.dialog .picks .pk .t { flex:1; min-width:0; display:flex; flex-direction:column; gap:1px }
.dialog .picks .pk .t .ln { display:flex; align-items:center; gap:6px }
.dialog .picks .pk .t .em { font-size:12px; color:var(--muted) }
.dialog .picks .pk .t .sub { font-size:12px; color:var(--muted); overflow-wrap:anywhere }

/* Import: a checkbox row per candidate (name over "alias · email", a mark at the end), the result list. */
.r.cand { min-height:44px; padding:6px 12px; gap:10px }
.r.cand .t { flex:1; min-width:0; display:flex; flex-direction:column; gap:1px }
.r.cand .t .sub { font-size:12px; color:var(--muted); overflow-wrap:anywhere }
.r.cand .mk { flex:none; font-size:12px; color:var(--muted) }
.r.cand .mk.lim { display:inline-flex; align-items:center; gap:4px }
.r.cand .mk svg { width:12px; height:12px }
.r.cand.off .t > span:first-child { color:var(--muted) }
.scroll.import-busy .g { opacity:.5 }
.r.done { gap:8px }
.r.done .em { flex:1; min-width:0; font-size:12px; color:var(--muted); overflow-wrap:anywhere }
.center .spinner { margin-bottom:8px }
</style>
<aside class="controls">
  <div><h2>State</h2><div class="group" id="states"></div></div>
  <div><h2>Scheme</h2><div class="group" id="schemes"></div></div>
  <div><h2>Language</h2><div class="group" id="langs"></div></div>
  <div><h2>Material</h2><div class="group" id="materials"></div></div>
  <div class="hint">URL: <code>?state=…&amp;scheme=dark&amp;lang=zh&amp;material=solid</code><br><kbd>←</kbd> <kbd>→</kbd> switch state.<br>The manual language choice follows the Language switch.</div>
</aside>
<div class="win" id="win"></div>
<script>
const TEXT = {
  zh: {
    window:'Idset · 设置', general:'通用', backups:'备份', config:'配置',
    gLanguage:'界面语言', system:'跟随系统', current:'当前：简体中文', langNote:'立即生效。', systemNote:'现在跟随系统：简体中文。',
    gStartup:'启动', login:'登录时启动', loginNote:'登录后在托盘里启动 Idset。',
    approve:'需要批准：在「系统设置 › 通用 › 登录项与扩展」里打开 Idset。',
    loginFail:'无法更改登录项：operation not permitted',
    restore:'恢复', restoring:'正在恢复…', restored:'已恢复', del:'删除', expand:'显示身份', collapse:'隐藏身份', cancel:'取消',
    identities:n => `${n} 个身份`, unreadable:'无法读取的备份', more:n => `+${n}`, global:'全局', scoped:'限定',
    backupNote:'新增身份前和恢复前自动备份，保留最新 10 份，位于 ~/.config/idset/backups/。',
    readonlyBanner:'accounts.json 读不出来，Idset 只读。恢复一份备份即可。',
    failed:'无法恢复：~/.config/idset/accounts.json 是符号链接。',
    emptyTitle:'还没有备份', emptyBody:'新增身份前和恢复前会自动备份。',
    confirmTitle:t => `恢复 ${t} 的备份？`, confirmBody:'先备份当前的 accounts.json，再替换。恢复后的身份：', confirmNote:'不在备份里的身份会被移除。',
    gInclude:'Include', present:'有 Include 标记块', absent:'没有 Include 标记块',
    remove:'移除 Include…', removed:'已移除',
    includeNote:'只移除 Idset 的标记块；修改身份时会加回。',
    removedNote:'已移除。修改身份时会加回。',
    removeFail:'无法写入 ~/.gitconfig：permission denied。~/.ssh/config 里的标记块已经移除。',

  let pubNote = '';
  if (s === 'keysnopub') pubNote = note('err', 'warn', T.noPub(`<span class="mono">${path}.pub</span>`));
  const copyBtn = s === 'keyscopied' ? `<span class="muted">${T.copied}</span>${ghost('check', T.copyPub)}` : ghost('copy', T.copyPub);
  const used = s === 'keysused';
  const addRow = custom
    ? `<div class="r"><div class="k wide">${T.addCustom}</div><span class="hint-end">${T.addCustomHint}</span></div>`
    : `<div class="r"><div class="k wide">${T.addOn('GitHub')}</div><div class="tail"><button>${T.openSettings('GitHub')}${icon.ext}</button></div></div>`;
  const agentRow = `<div class="r"><div class="k wide">${T.agent}</div><div class="tail">${s === 'keysagent' ? done('', T.loaded) : `<button${s === 'keysagentfail' ? ' disabled' : ''}>${T.load}</button>`}</div></div>`;
  const useRow = `<div class="r"><div class="k wide">${T.useFor}</div><div class="tail">${used ? `<span class="who">${dot(IDS.side)}${IDS.side.label}</span><button class="text">${T.change}</button>` : `<button>${T.choose}</button>`}</div></div>`;
  let nextNote = note('', '', custom ? T.nextCustom : T.nextNote('GitHub'));
  if (s === 'keysagentfail') nextNote = note('warn', 'warn', T.agentFail);
  if (used) nextNote = note('ok', 'check', T.usedNote(IDS.side.label));
  const result =
    `<div class="keyhead">${icon.check}<h2>${T.created}</h2><span class="mark">Ed25519 · ${platform}</span></div>` +
    group(T.pubKey, `<div class="r keytext mono">${PUBKEY}</div><div class="r add" style="justify-content:flex-end">${copyBtn}</div>`, pubNote) +
    `<div class="files">` + group(T.kFiles,
      `<div class="r"><div class="k">${T.priv}</div><div class="v mono">${path}</div><div class="tail">${ghost('folder', T.reveal)}</div></div>` +
      `<div class="r"><div class="k">${T.pub}</div><div class="v mono">${path}.pub</div><div class="tail"><span style="width:24px"></span></div></div>` +
      `<div class="r"><div class="k">${T.fp}</div><div class="v mono">${FINGERPRINT}</div><div class="tail"><span style="width:24px"></span></div></div>` +
      `<div class="r"><div class="k">${T.pass}</div><div class="v">${T.none}</div><div class="tail"><span style="width:24px"></span></div></div>`,
      note('', '', T.passNote(path))) + `</div>` +
    group(T.kNext, addRow + agentRow + useRow, nextNote) +
    `<div class="actrow"><button class="text">${T.another}</button></div>`;
  const keysPane = ['keys', 'keysinvalid', 'keysexists', 'keysrunning', 'keysfail', 'keysdiag'].includes(s) ? form : result;

  // Import: scanned when the pane opens; one checkbox row per candidate, then the import button.
  const CANDS = [
    { name:'gh-work', alias:'gh-work', email:'bob@example.com', on:true },
    { name:'github.com', alias:'', email:'bob@example.net', on:true, limited:s === 'importlimited' },
    { name:'client', alias:'client', email:'bob@client.example', on:true, limited:s === 'importlimited' },
    { name:'corp-git', alias:'corp-git', email:'', on:false },
    { name:'gh-idset', alias:'gh-idset', email:'bob@example.org', on:false, exists:true },
  ];
  const box = on => `<span class="check${on ? ' on' : ''}" role="checkbox" aria-checked="${on}"><i>${on ? icon.check : ''}</i></span>`;
  const checked = CANDS.filter(c => c.on).length;
  const importing = s === 'importing';
  const cand = c => {
    const sub = [c.alias || T.noAlias, c.email].filter(Boolean).join(' · ');
    let mk = '';
    if (c.exists) mk = `<span class="mk">${T.exists}</span>`;
    if (c.limited) mk = `<span class="mk lim">${icon.folder}${T.asLimited}</span>`;
    return `<div class="r cand${c.on ? '' : ' off'}">${box(c.on)}<div class="t"><span>${c.name}</span><span class="sub">${sub}</span></div>${mk}</div>`;
  };
  let importNote = note('', '', T.readNote);
  if (s === 'importlimited') importNote += note('', '', T.limitedNote);
  if (s === 'importfail') importNote = note('err', 'warn', T.importFail('client', 2, 'accounts.json is a symbolic link'));
  const importAct = `<div class="actrow split">${ghost('refresh', T.rescan, importing)}<span style="flex:1"></span>${importing ? `<span class="muted">${T.importing}</span>${spinner}` : ''}<button class="primary"${importing || s === 'importreadonly' ? ' disabled' : ''}>${T.importN(checked)}</button></div>`;
  const centered = (head, body, acts = '') => `<div class="center">${head}<span class="muted" style="max-width:420px;line-height:1.45">${body}</span>${acts ? `<div class="acts">${acts}</div>` : ''}</div>`;
  const IMPORTED = [IDS.work, { ...IDS.personal, label:'github.com' }, { ...IDS.client, label:'client' }];
  let importPane = group(T.found(CANDS.length), CANDS.map(cand).join(''), importNote) + importAct;
  if (s === 'importreadonly') importPane = `<div class="banner">${icon.warn}<span>${T.importReadOnly}</span></div>` + importPane;
  if (s === 'scanning') importPane = centered(`${spinner}<strong>${T.scanning}</strong>`, T.scanningSub);
  if (s === 'importnone') importPane = centered(`<strong>${T.noneTitle}</strong>`, T.noneBody, `<button>${T.rescan}</button>`);
  if (s === 'scanfail') importPane = `<div class="banner">${icon.warn}<span>${T.scanFail}</span></div><div class="actrow"><button>${T.rescan}</button></div>`;
  if (s === 'imported') importPane =
    `<div class="keyhead">${icon.check}<h2>${T.doneTitle(IMPORTED.length)}</h2></div>` +
    group('', IMPORTED.map(d => `<div class="r done">${dot(d)}<span>${d.label}</span><span class="em">${d.email}</span></div>`).join(''), note('ok', 'check', T.doneNote)) +
    `<div class="actrow split">${ghost('refresh', T.rescan)}<button>${T.openAccounts}</button></div>`;

  // Dialogs: the restore and remove confirmations and the identity picker, over the dimmed window.
  let dialog = '';
  if (s === 'keysuse') {
    const radio = on => `<span class="radio${on ? ' on' : ''}"><i></i></span>`;
    const pk = (on, head, sub) => `<div class="pk">${radio(on)}<div class="t">${head}<span class="sub">${sub}</span></div></div>`;
    dialog = `<div class="scrim"><div class="dialog" role="alertdialog"><h2>${T.useTitle}</h2><p>${T.useBody}</p>
      <div class="picks">${Object.values(IDS).map(d => pk(d === IDS.side, `<span class="ln">${dot(d)}<span>${d.label}</span><span class="em">${d.email}</span></span>`, d.key ? T.nowKey(`<span class="mono">${d.key}</span>`) : T.noKey)).join('')}
      ${pk(false, `<span class="ln">${T.newId}</span>`, T.newIdSub('bob@example.com', 'GitHub'))}</div>
      <div class="small">${T.useNote}</div>
      <div class="buttons"><button>${T.cancel}</button><button class="primary">${T.useBtn}</button></div></div></div>`;
  }
  if (s === 'confirm') {
    const b = BACKUPS[target];
    dialog = `<div class="scrim"><div class="dialog" role="alertdialog"><h2>${T.confirmTitle(b.time)}</h2><p>${T.confirmBody}</p>
      <div class="ids">${b.ids.map(k => `<div class="li">${dot(IDS[k])}<span>${IDS[k].label}</span><span class="em">${IDS[k].email}</span></div>`).join('')}</div>
      <div class="small">${T.confirmNote}</div>
      <div class="buttons"><button>${T.cancel}</button><button class="primary">${T.restore}</button></div></div></div>`;
  }
  if (s === 'remove') {
    dialog = `<div class="scrim"><div class="dialog" role="alertdialog"><h2>${T.removeTitle}</h2><p>${T.removeBody}</p>
      <div class="sec"><h3>${T.removes}</h3>${['~/.ssh/config', '~/.gitconfig'].map(f => `<div class="li gone">${icon.minus}<span>${T.markerIn(`<span class="mono">${f}</span>`)}</span></div>`).join('')}</div>
      <div class="sec"><h3>${T.keeps}</h3>${T.keptList.map(k => `<div class="li kept">${icon.check}<span>${k}</span></div>`).join('')}</div>
      <div class="buttons"><button>${T.cancel}</button><button class="primary">${T.removeBtn}</button></div></div></div>`;
  }

  const nav = [['general', 'sliders', T.general], ['keys', 'key', T.keys], ['import', 'import', T.imports], ['backups', 'clock', T.backups], ['config', 'doc', T.config]]
    .map(([id, ic, label]) => `<div class="tab${pane === id ? ' sel' : ''}" role="tab" aria-selected="${pane === id}">${icon[ic]}<span>${label}</span></div>`).join('');
  const body = { general, keys:keysPane, import:importPane, backups:backupsPane, config:configPane }[pane];
  document.documentElement.dataset.scheme = view.scheme;
  document.body.classList.toggle('solid', view.material === 'solid');
  document.getElementById('win').innerHTML = `<div class="band"><div class="titlebar"><span class="lights"><i></i><i></i><i></i></span>${T.window}</div><div class="tabs" role="tablist">${nav}</div></div>
    <div class="body"><div class="detail"><div class="scroll pane${running ? ' form-busy' : ''}${importing ? ' import-busy' : ''}">${body}</div></div></div>${dialog}`;

  const buttons = (id, options, key) => {
    document.getElementById(id).innerHTML = Object.entries(options)
      .map(([value, label]) => `<button data-value="${value}" class="${view[key] === value ? 'on' : ''}">${label}</button>`).join('');
    document.getElementById(id).onclick = e => { const v = e.target.dataset.value; if (v) { view[key] = v; render(); } };
  };
  buttons('states', STATES, 'state');
  buttons('schemes', { light:'浅色', dark:'深色' }, 'scheme');
  buttons('langs', { zh:'中文', en:'English' }, 'lang');
  buttons('materials', { glass:'Glass', solid:'Solid' }, 'material');
  history.replaceState(null, '', `?state=${view.state}&scheme=${view.scheme}&lang=${view.lang}${view.material === 'solid' ? '&material=solid' : ''}`);
}

onkeydown = e => {
  if (e.key !== 'ArrowLeft' && e.key !== 'ArrowRight') return;
  const keys = Object.keys(STATES), i = keys.indexOf(view.state);
  view.state = keys[(i + (e.key === 'ArrowRight' ? 1 : keys.length - 1)) % keys.length];
  render();
};
render();
</script>
</html>
