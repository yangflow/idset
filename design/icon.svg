<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- Idset's product icon: an ivory folder with a keyhole on a graphite tile, on the macOS grid (824 tile at 100,
       radius 185). The keyhole is cut through the folder, and a smaller mint keyhole sits lit inside it: the folder's
       lock and the identity that fits it. The folder and the keyholes are drawn on a 100 grid, the same numbers
       internal/trayicon uses for the tray icon, and placed on the tile by one transform.
       design/export-icon.sh renders it to resources/icon.png. -->
  <defs>
    <linearGradient id="field" x1="0" y1="0" x2=".35" y2="1">
      <stop offset="0" stop-color="#5b6170"/><stop offset=".45" stop-color="#2c303a"/><stop offset="1" stop-color="#16181d"/>
    </linearGradient>
    <radialGradient id="sheen" cx=".22" cy=".12" r=".75">
      <stop offset="0" stop-color="#fff" stop-opacity=".45"/><stop offset=".55" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="shade" x1="0" y1="0" x2="0" y2="1">
      <stop offset=".55" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".3"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".7"/><stop offset=".25" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="face" gradientUnits="userSpaceOnUse" x1="0" y1="20" x2="0" y2="84">
      <stop offset="0" stop-color="#f6f1e7"/><stop offset="1" stop-color="#dcd3c3"/>
    </linearGradient>
    <linearGradient id="depth" gradientUnits="userSpaceOnUse" x1="0" y1="20" x2="0" y2="88">
      <stop offset="0" stop-color="#0e1014"/><stop offset="1" stop-color="#000"/>
    </linearGradient>
    <linearGradient id="lit" gradientUnits="userSpaceOnUse" x1="0" y1="46" x2="0" y2="71">
      <stop offset="0" stop-color="#7ff0c8"/><stop offset=".45" stop-color="#4ee6b0"/><stop offset="1" stop-color="#14b896"/>
    </linearGradient>
    <filter id="tile-shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#000" flood-opacity=".28"/>
    </filter>
    <filter id="lift" filterUnits="userSpaceOnUse" x="0" y="0" width="100" height="100">
      <feDropShadow dx="0" dy="2.6" stdDeviation="2.3" flood-color="#000" flood-opacity=".45"/>
    </filter>
    <filter id="glow" filterUnits="userSpaceOnUse" x="30" y="35" width="40" height="45">
      <feGaussianBlur stdDeviation="2.6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <!-- The keyhole cut through the folder: a round head and a tapered foot. -->
    <mask id="keyhole" maskUnits="userSpaceOnUse" x="0" y="0" width="100" height="100">
      <rect width="100" height="100" fill="#fff"/>
      <circle cx="50" cy="53" r="11.5"/>
      <path d="M43.5 57L56.5 57L58.75 73.3Q58.75 75.5 56.55 75.5L43.45 75.5Q41.25 75.5 41.25 73.3Z"/>
    </mask>
    <!-- The folder, its tab at the upper left; drawn twice, as the depth and as the face. -->
    <g id="folder" mask="url(#keyhole)">
      <path d="M10 33Q10 20 23 20L35 20Q40 20 43 24L45.5 27.5Q47.5 30 51 30L77 30Q90 30 90 43L90 71Q90 84 77 84L23 84Q10 84 10 71Z"/>
    </g>
  </defs>
  <g filter="url(#tile-shadow)"><rect x="100" y="100" width="824" height="824" rx="185" fill="url(#field)"/></g>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#sheen)"/>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#shade)"/>
  <rect x="102" y="102" width="820" height="820" rx="183" fill="none" stroke="url(#rim)" stroke-width="4"/>
  <g transform="matrix(7 0 0 7 162 138)">
    <use href="#folder" transform="translate(0 3.6)" fill="url(#depth)"/>
    <use href="#folder" filter="url(#lift)" fill="url(#face)"/>
    <path d="M14.5 32Q14.5 24 22.5 24L34 24" fill="none" stroke="#fffaf0" stroke-width="1.6" stroke-linecap="round" opacity=".85"/>
    <g filter="url(#glow)" fill="url(#lit)">
      <circle cx="50" cy="53" r="7"/>
      <path d="M46.75 57L53.25 57L54.75 68.8Q54.75 71 52.55 71L47.45 71Q45.25 71 45.25 68.8Z"/>
    </g>
  </g>
</svg>
